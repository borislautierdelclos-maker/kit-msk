<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5A86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Répertoire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Répertoire des entités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one column, lightbox-blue chrome; sticky search on top, list grouped surspé > famille, fiche opens full-width in place */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --line:#CDD5DD;
  --fg:#16202A; --muted:#5A6876; --ink:#1D5A86; --ink-soft:#DCE9F3;
  --warn:#9A5B00; --warn-soft:#FBEBD2; --ok:#1F6B46; --ok-soft:#DCEFE4;
  --danger:#A2312A; --danger-soft:#F8E1DF; --star:#B87400;
  --f-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161E26; --sunk:#1C2630; --line:#2A3743;
  --fg:#E4EAF0; --muted:#93A2B1; --ink:#82BCE6; --ink-soft:#1A3246;
  --warn:#F0B35C; --warn-soft:#3A2A12; --ok:#7CCFA2; --ok-soft:#153225;
  --danger:#F08A80; --danger-soft:#3C1C1A; --star:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161E26; --sunk:#1C2630; --line:#2A3743;
  --fg:#E4EAF0; --muted:#93A2B1; --ink:#82BCE6; --ink-soft:#1A3246;
  --warn:#F0B35C; --warn-soft:#3A2A12; --ok:#7CCFA2; --ok-soft:#153225;
  --danger:#F08A80; --danger-soft:#3C1C1A; --star:#F2C14E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin:0}
.brand .count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding:11px 12px 11px 36px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:1rem}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.addbtn{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border:0;border-radius:var(--r);background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.85rem;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:.72rem;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
.chips.sub .chip{font-size:.8rem;padding:4px 10px;background:transparent}

/* queue */
.queue{display:grid;gap:6px;margin-top:14px}
.qitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:9px 12px;font-size:.9rem}
.qitem .qn{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.qitem .qs{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qitem.err{border-color:var(--danger);border-style:solid}
.qitem.err .qs{color:var(--danger)}
.qitem .qmsg{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.linkbtn{border:0;background:none;color:var(--ink);font-size:.82rem;padding:2px 4px;text-decoration:underline}

/* list */
.group{margin-top:22px}
.group>h2{font-family:var(--f-display);font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.group>h2 .dot{width:9px;height:9px;border-radius:2px}
.fam{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin:12px 0 4px;letter-spacing:.04em}
.rows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 14px}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .n{font-weight:700;min-width:0}
.row .k{grid-column:1/-1;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;align-self:center}
.st.av{background:var(--warn-soft);color:var(--warn)}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.empty{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.empty h2{font-family:var(--f-display);font-size:1.1rem;margin:0 0 8px}
.empty p{margin:0 0 8px;color:var(--muted)}
.notice{margin-top:12px;font-size:.85rem;color:var(--muted)}

/* fiche */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);padding:14px 0 4px;font-weight:700}
.fh{margin-top:6px}
.crumb{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fh h2{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1.1;letter-spacing:-.015em;margin:6px 0 4px;text-wrap:balance}
.syn{color:var(--muted);font-size:.9rem;font-style:italic}
.key{margin-top:14px;background:var(--ink-soft);border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:1.02rem}
.key small{display:block;font-family:var(--f-mono);font-weight:500;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.sec{margin-top:18px}
.sec h3{font-family:var(--f-display);font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sec ul{margin:0;padding-left:1.1em}
.sec li{margin:3px 0}
.sec li::marker{color:var(--muted)}
.mod{margin-top:8px}
.mod ul{margin:0;padding-left:1.1em}.mod li{margin:3px 0}
.mod h4{font-family:var(--f-mono);font-size:.74rem;font-weight:500;color:var(--muted);margin:10px 0 3px;letter-spacing:.03em}
.dd{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.dd div{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr);gap:12px;padding:8px 12px;border-top:1px solid var(--line);font-size:.92rem}
.dd div:first-child{border-top:0}
.dd b{min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){.dd div{grid-template-columns:1fr;gap:2px}}
.trap{margin-top:18px;background:var(--danger-soft);border-left:3px solid var(--danger);border-radius:4px;padding:10px 14px}
.trap h3{color:var(--danger);border:0;padding:0}
.star{color:var(--star)}
.src{font-size:.86rem}
.src a{color:var(--ink);overflow-wrap:anywhere}
.ctx{font-size:.88rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:.88rem}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:var(--surface);font-weight:700}
.meta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:10px}
.revbox{width:100%;margin-top:10px;display:grid;gap:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-family:var(--f-display);margin:0;font-size:1.2rem}
.field{display:grid;gap:4px}
.field label{font-size:.8rem;color:var(--muted);font-weight:700}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{min-height:70px;resize:vertical}
.sheetbtns{display:flex;gap:8px;justify-content:flex-end}
.brand .right{display:flex;align-items:center;gap:10px}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;padding:0;color:var(--fg)}
.kind{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
/* markdown body */
.md{margin-top:16px}
.md h1,.md h2,.md h3,.md h4{font-family:var(--f-display);color:var(--ink);margin:20px 0 6px;line-height:1.2}
.md h2{font-size:1rem;letter-spacing:.06em;text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid var(--line)}
.md h3{font-size:.95rem}
.md h4{font-size:.85rem}
.md p{margin:8px 0}
.md ul,.md ol{margin:6px 0;padding-left:1.2em}
.md li{margin:3px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.md blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--ink);background:var(--ink-soft);border-radius:4px}
.md code{font-family:var(--f-mono);font-size:.85em;background:var(--sunk);padding:1px 4px;border-radius:4px}
.md a{color:var(--ink)}
.md img{display:block;border-radius:8px;margin:10px 0;cursor:zoom-in;background:#fff}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tw table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.tw th,.tw td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tw th{background:var(--sunk);font-family:var(--f-display);font-size:.8rem;border-top:0}
.wl{color:var(--ink);text-decoration:underline dotted;cursor:pointer}
.wl.dead{color:var(--muted);cursor:default;text-decoration:none}
/* images */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;cursor:zoom-in}
.gal figcaption{font-size:.8rem;color:var(--muted);padding:6px 8px;display:flex;gap:6px;justify-content:space-between;align-items:center}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(5,8,12,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:9px 6px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.addhere{display:inline-block;margin:4px 0 2px;font-size:.75rem;color:var(--muted);cursor:pointer;opacity:.75}
.addhere:hover{color:var(--ink);opacity:1}
.sech{font-family:var(--f-display);font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.gal{margin:8px 0}
.gal figcaption{flex-wrap:wrap}
.gal .cap{flex:1;min-width:0}
.gal .mv{width:100%;font-size:.75rem;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted)}
.slot{border-radius:8px;transition:background .15s, outline-color .15s;outline:2px dashed transparent;outline-offset:2px}
body.is-dragging .slot{outline-color:var(--line);min-height:28px;margin:6px 0}
.slot.over{outline-color:var(--ink);background:var(--ink-soft)}
.fig{margin:10px auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fig.sz-s{width:34%}.fig.sz-m{width:55%}.fig.sz-l{width:80%}.fig.sz-xl{width:100%}
@media (max-width:520px){.fig.sz-s{width:50%}.fig.sz-m{width:75%}.fig.sz-l,.fig.sz-xl{width:100%}}
.fig img{display:block;width:100%;height:auto;background:#fff;cursor:zoom-in}
.fig figcaption{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 8px;font-size:.8rem;color:var(--muted)}
.fig .cap{flex:1 1 100%;min-width:0}
.figact{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.handle{cursor:grab;touch-action:none;user-select:none;font-size:1.1rem;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.szs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.szb{border:0;background:var(--bg);font-size:.68rem;padding:3px 7px;font-family:var(--f-mono);color:var(--muted)}
.szb.on{background:var(--ink);color:var(--surface)}
.fig.dragging{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.85;box-shadow:0 8px 24px rgba(0,0,0,.25);margin:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
.offline{font-family:var(--f-mono);font-size:.66rem;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Répertoire des entités</h1><span class="right"><span class="offline" id="offline" hidden>hors ligne</span><span class="count" id="count"></span><button class="themebtn" id="themebtn" aria-label="Changer de thème"></button></span></div>
    <div class="searchrow">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Rechercher une entité, un signe…" autocomplete="off" aria-label="Rechercher">
      </div>
      <button class="addbtn" id="addbtn" aria-label="Ficher une entité"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ficher</button>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Surspécialités"></div>
    <div class="chips sub" id="subchips" role="toolbar" aria-label="Familles" hidden></div>
  </header>
  <main id="main"></main>
</div>
<div id="sheetroot"></div>
<div id="lbroot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const SURSPE = [
 ["MSK","#2E7D8C"],["Rachis","#5B7F3A"],["Neuro","#6A4FA3"],["ORL","#A0527A"],["Thorax","#3570B5"],
 ["Cardiaque","#B8443B"],["Vasculaire","#C2611F"],["Digestif","#8A6A1F"],["Uro","#2F8A6A"],["Gynéco","#B04A8C"],
 ["Sein","#C25A6E"],["Pédiatrie","#3E8FB0"],["Hémato","#8E3B46"],["Onco","#5E5E8C"],["Trauma","#7A5C3E"],
 ["Interventionnel","#40707A"],["Transversal","#6B7480"]];
const SCOLOR = Object.fromEntries(SURSPE);
const FAMILLES = ["Classification / score","Démarche / orientation","Technique / protocole","Anatomie / mesures","Tumoral","Infectieux","Inflammatoire / auto-immun","Vasculaire","Traumatique","Dégénératif","Congénital / malformatif","Métabolique / toxique","Iatrogène","Autre"];
const IMGCACHE = {};
const imgUrl = im => im && (im.url ? im.url : (im.fs && IMGCACHE[im.fs]) || "");
const COL = {fiches:"rep_fiches", queue:"rep_queue", imgs:"rep_imgs", meta:"rep_meta"};

/* theme */
const THEMES = [["auto","Thème : système"],["light","Thème : clair"],["dark","Thème : sombre"]];
let theme = "auto"; try{ theme = localStorage.getItem("theme") || "auto"; }catch{}
function applyTheme(){
  const r = document.documentElement;
  if(theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", theme);
  const b = document.getElementById("themebtn"); if(!b) return;
  const icon = theme==="dark" ? '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>' : theme==="light" ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>' : '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/>';
  b.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${icon}</svg>`;
  b.title = b.ariaLabel = THEMES.find(t=>t[0]===theme)[1];
}

/* markdown */
function mdHtml(md){
  if(!md) return "";
  let out;
  if(window.marked){
    try{
      marked.use({renderer:{html(h){ return esc(typeof h==="string"?h:(h&&(h.text||h.raw))||""); }}});
      out = marked.parse(String(md), {gfm:true, breaks:true});
    }catch{ out = null; }
  }
  if(out==null) out = `<p>${esc(md).replace(/\n/g,"<br>")}</p>`;
  out = out.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
  out = out.replace(/<img /g,'<img loading="lazy" ').replace(/src="fs:([A-Za-z0-9_-]+)"/g,'src="" data-fs="$1"');
  out = out.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g,(m,t,a)=>{
    const target = findByTitle(t);
    return target ? `<a class="wl" data-go="${esc(target.id)}">${esc(a||t)}</a>` : `<span class="wl dead">${esc(a||t)}</span>`;
  });
  return out.replace(/★+/g, m => `<span class="star">${m}</span>`);
}

/* images */
async function compress(file){
  try{
    const bmp = await createImageBitmap(file);
    const max = 1800, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/webp",0.86));
    return blob && blob.size < file.size ? blob : file;
  }catch{ return file; }
}
function toDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
async function shrink(file){
  for(const [max,q] of [[1800,.86],[1400,.8],[1000,.75]]){
    try{
      const bmp = await createImageBitmap(file); const k = Math.min(1, max/Math.max(bmp.width,bmp.height));
      const c = document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
      c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
      const b = await new Promise(r=>c.toBlob(r,"image/webp",q)); if(b && b.size < 700000) return b;
    }catch{ break; }
  }
  return file.size < 700000 ? file : null;
}
async function uploadImages(files){
  const out = [];
  for(const f of files){
    const b = await shrink(f); if(!b) throw {code:"too_big"};
    const data = await toDataURL(b);
    const id = Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    IMGCACHE[id] = data;
    state.db.collection(COL.imgs).doc(id).set({data, created_at:new Date().toISOString()}).catch(()=>{});
    out.push({fs:id});
  }
  return out;
}
async function hydrateImgs(){
  for(const el of document.querySelectorAll("img[data-fs]")){
    const id = el.dataset.fs;
    if(!IMGCACHE[id]){ try{ const d = await state.db.collection(COL.imgs).doc(id).get(); if(d.exists) IMGCACHE[id] = d.data().data; }catch{} }
    if(IMGCACHE[id]) el.src = IMGCACHE[id];
  }
}

const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || "entite";

/* ---------- search ---------- */
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function haystack(f){
  const im = arr(f.imagerie).map(m=>[m.modalite,...arr(m.points)].join(" ")).join(" ");
  const dd = arr(f.dd).map(d=>d.entite+" "+d.distinction).join(" ");
  return norm([f.cle,...arr(f.epidemio),...arr(f.clinique),im,dd,...arr(f.pieges),...arr(f.tags),f.contenu_md||""].join(" "));
}
function score(f, q){
  const names = [f.nom, f.nom_en, f.titre_obsidian, ...arr(f.synonymes)].filter(Boolean).map(norm);
  const terms = q.split(/\s+/).filter(Boolean);
  if(names.some(n=>n===q)) return 100;
  if(names.some(n=>n.startsWith(q))) return 80;
  if(names.some(n=>n.includes(q))) return 60;
  const words = names.join(" ").split(/[^a-z0-9]+/).filter(Boolean);
  if(terms.every(t=>words.some(w=>w.startsWith(t) || (t.length>4 && lev(t,w.slice(0,t.length+1))<=1)))) return 45;
  const h = haystack(f);
  if(terms.every(t=>h.includes(t))) return 20;
  return 0;
}

function ficheSections(f){

  if(arr(f.clinique).length) out.push({key:"clinique",label:"Clinique",html:`<section class="sec"><h3>Clinique</h3>${list(f.clinique)}</section>`});

  if(arr(f.pieges).length) out.push({key:"pieges",label:"Pièges",html:`<section class="trap sec"><h3>Pièges</h3>${list(f.pieges)}</section>`});

}

  if(t.dataset.cap!==undefined){ state.capFor=+t.dataset.cap; renderFiche(); setTimeout(()=>$("#capin")?.focus(),30); return; }
  if(t.dataset.capsave!==undefined){ const i=+t.dataset.capsave; const ims=arr(f.images).map(x=>({...x})); ims[i].legende=$("#capin").value.trim(); state.capFor=null; try{ await saveImages(f,ims); }catch{ toast("Légende non enregistrée."); } renderFiche(); return; }
  if(t.dataset.imgdel!==undefined){ const i=+t.dataset.imgdel; const ims=arr(f.images).filter((_,j)=>j!==i); try{ await saveImages(f,ims); toast("Image retirée"); }catch{ toast("Impossible de retirer l'image."); } return; }
  if(t.dataset.del==="1"){ state.confirmDel=true; renderFiche(); return; }
  if(t.dataset.del==="0"){ state.confirmDel=false; renderFiche(); return; }
  if(t.dataset.del==="2"){ state.db.collection(COL.fiches).doc(f.id).delete().catch(()=>toast("Suppression impossible.")); state.open=null; state.confirmDel=false; toast("Fiche supprimée"); render(); return; }
  if(t.dataset.rev==="1"){ state.rev=true; renderFiche(); setTimeout(()=>$("#revtxt")?.focus(),30); return; }
  if(t.dataset.rev==="0"){ state.rev=false; renderFiche(); return; }
  if(t.dataset.revgo){ const txt=$("#revtxt").value.trim(); if(!txt){ $("#revtxt").focus(); return; }
    enqueue({type:"revise", nom:f.nom, fiche_id:f.id, consigne:txt}); state.rev=false; toast("Correction envoyée : elle sera faite au prochain passage"); renderFiche(); }
});
document.addEventListener("submit", async e=>{
  if(e.target.id!=="addform") return;
  e.preventDefault();
  const nom = $("#f-nom").value.trim(); if(!nom) return;
  const existing = state.fiches.find(f=>[f.nom,f.nom_en,...arr(f.synonymes)].filter(Boolean).some(n=>norm(n)===norm(nom)));
  if(existing){ closeSheet(); state.open=existing.id; render(); toast("Cette entité a déjà sa fiche"); return; }
  const btn = e.target.querySelector("[type=submit]"); btn.disabled=true; btn.textContent="Envoi…";
  try{
    let images = [];
    if(state.addFiles.length){ btn.textContent="Envoi des images…"; images = await uploadImages(state.addFiles); }
    enqueue({type:"new", kind:state.addKind, nom, contexte:$("#f-ctx").value.trim(), surspe_hint:$("#f-ss").value, images});
    closeSheet(); state.q=""; $("#q").value="";
    toast(navigator.onLine ? "Ajoutée : la fiche arrive au prochain passage (moins d'une heure)" : "Ajoutée hors ligne : envoi dès que le réseau revient");
  }catch(err){ btn.disabled=false; btn.textContent="Lancer la fiche"; toast(err&&err.code==="too_big"?"Image trop lourde.":"Envoi impossible."); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if($("#lbroot").innerHTML) $("#lbroot").innerHTML=""; else if($("#sheetroot").innerHTML) closeSheet(); } });
function showThumbs(){ const th=$("#f-thumbs"); if(!th) return; th.innerHTML=""; state.addFiles.forEach(f=>{ const i=document.createElement("img"); i.src=URL.createObjectURL(f); i.alt=""; th.appendChild(i); }); }
document.addEventListener("change", async e=>{
  if(e.target.dataset && e.target.dataset.move!==undefined){
    const f = state.fiches.find(x=>x.id===state.open); if(!f) return;
    const i=+e.target.dataset.move; const ims=arr(f.images).map(x=>({...x})); ims[i].section=e.target.value; saveImages(f,ims); toast("Image déplacée"); return;
  }
  if(e.target.id==="f-img"){ state.addFiles=[...e.target.files]; showThumbs(); return; }
  if(e.target.id==="imgup"){
    const f = state.fiches.find(x=>x.id===state.open); const files=[...e.target.files]; if(!f||!files.length) return;
    toast("Envoi de l'image…");
    const sec = state.targetSec || "fin"; state.targetSec = null; e.target.value = "";
    try{ const up = await uploadImages(files); await saveImages(f, arr(f.images).concat(up.map(u=>({...u, legende:"", section:sec})))); toast("Image ajoutée"); renderFiche(); }
    catch(err){ toast(err&&err.code==="too_big"?"Image trop lourde.":"Envoi impossible, réessaie."); }
  }
});
document.addEventListener("paste", e=>{
  const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith("image/")); if(!files.length) return;
  if($("#f-img")){ state.addFiles=state.addFiles.concat(files); showThumbs(); e.preventDefault(); }
});
$("#q").addEventListener("input", e=>{ state.q=e.target.value; state.open=null; renderList(); });

/* ---------- drag & drop des images ---------- */
let drag=null;
document.addEventListener("pointerdown", e=>{
  const h=e.target.closest("[data-drag]"); if(!h) return;
  e.preventDefault();
  const fig=h.closest("figure"); const r=fig.getBoundingClientRect();
  const ghost=fig.cloneNode(true); ghost.className+=" ghost"; ghost.style.width=r.width+"px"; ghost.style.left=r.left+"px"; ghost.style.top=r.top+"px";
  document.body.appendChild(ghost); fig.classList.add("dragging"); document.body.classList.add("is-dragging");
  drag={i:+h.dataset.drag, ghost, fig, dx:e.clientX-r.left, dy:e.clientY-r.top, slot:null};
  try{ h.setPointerCapture(e.pointerId); }catch{}
});
document.addEventListener("pointermove", e=>{
  if(!drag) return; e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.dx)+"px"; drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  drag.ghost.style.display="none"; const el=document.elementFromPoint(e.clientX,e.clientY); drag.ghost.style.display="";
  const slot=el && el.closest && el.closest(".slot");
  if(slot!==drag.slot){ drag.slot&&drag.slot.classList.remove("over"); slot&&slot.classList.add("over"); drag.slot=slot; }
  if(e.clientY<60) window.scrollBy(0,-12); else if(e.clientY>innerHeight-60) window.scrollBy(0,12);
},{passive:false});
function endDrag(){
  if(!drag) return; const d=drag; drag=null;
  d.ghost.remove(); d.fig.classList.remove("dragging"); document.body.classList.remove("is-dragging"); d.slot&&d.slot.classList.remove("over");
  if(!d.slot) return;
  const f=state.fiches.find(x=>x.id===state.open); if(!f) return;
  const ims=arr(f.images).map(x=>({...x})); const it=ims.splice(d.i,1)[0]; it.section=d.slot.dataset.slot; ims.push(it);
  saveImages(f,ims); toast("Image déplacée");
}
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);

addEventListener("online",netState); addEventListener("offline",netState); netState();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
async function seedIfNeeded(db){
  try{
    const meta = await db.collection(COL.meta).doc("seed").get();
    if(meta.exists && meta.data().v>=1) return;
    if(!navigator.onLine || meta.metadata.fromCache) return;
    const r = await fetch("seed.json",{cache:"no-store"}); if(!r.ok) return;
    const seed = await r.json();
    const ids = Object.keys(seed.fiches);
    for(let k=0;k<ids.length;k+=400){
      const b = db.batch();
      ids.slice(k,k+400).forEach(id=>b.set(db.collection(COL.fiches).doc(id), seed.fiches[id], {merge:true}));
      await b.commit();
    }
    await db.collection(COL.meta).doc("seed").set({v:seed.v, at:new Date().toISOString()});
    toast(`${ids.length} fiches importées`);
  }catch(e){ console.error("seed",e); toast("Import initial impossible : "+(e&&e.code||"erreur")); }
}
(function(){
  if(!window.firebase){ state.ready=true; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  state.db = db;
  db.collection(COL.fiches).onSnapshot(s=>{ state.fiches = s.docs.map(d=>({id:d.id,...d.data()})); state.ready=true; render(); }, e=>{ console.error(e); state.ready=true; render(); toast("Lecture des fiches impossible : "+(e&&e.code||"erreur")); });
  db.collection(COL.queue).onSnapshot(s=>{ state.queue = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))); state.open ? renderFiche() : renderList(); }, ()=>{});
  seedIfNeeded(db);
})();
</script>
