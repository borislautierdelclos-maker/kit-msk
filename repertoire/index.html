<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5A86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Répertoire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=7">
<link rel="icon" href="icon.png">
<title>Répertoire des entités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one column, lightbox-blue chrome; sticky search on top, list grouped surspé > famille, fiche opens full-width in place */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --line:#CDD5DD;
  --fg:#16202A; --muted:#5A6876; --ink:#1D5A86; --ink-soft:#DCE9F3;
  --warn:#9A5B00; --warn-soft:#FBEBD2; --ok:#1F6B46; --ok-soft:#DCEFE4;
  --danger:#A2312A; --danger-soft:#F8E1DF; --star:#B87400;
  --f-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161E26; --sunk:#1C2630; --line:#2A3743;
  --fg:#E4EAF0; --muted:#93A2B1; --ink:#82BCE6; --ink-soft:#1A3246;
  --warn:#F0B35C; --warn-soft:#3A2A12; --ok:#7CCFA2; --ok-soft:#153225;
  --danger:#F08A80; --danger-soft:#3C1C1A; --star:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161E26; --sunk:#1C2630; --line:#2A3743;
  --fg:#E4EAF0; --muted:#93A2B1; --ink:#82BCE6; --ink-soft:#1A3246;
  --warn:#F0B35C; --warn-soft:#3A2A12; --ok:#7CCFA2; --ok-soft:#153225;
  --danger:#F08A80; --danger-soft:#3C1C1A; --star:#F2C14E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin:0}
.brand .count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding:11px 12px 11px 36px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:1rem}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.addbtn{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border:0;border-radius:var(--r);background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.85rem;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:.72rem;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
.chips.sub{padding-top:8px}
.chips.sub .chip{font-size:.8rem;padding:4px 10px;background:var(--ink-soft);color:var(--ink);border-color:transparent;font-weight:700}
.chips.sub .chip b{color:var(--ink);opacity:.7}
.chips.sub .chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips.sub .chip[aria-pressed="true"] b{color:var(--surface);opacity:.85}

/* queue */
.queue{display:grid;gap:6px;margin-top:14px}
.qitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:9px 12px;font-size:.9rem}
.qitem .qn{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.qitem .qs{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qitem.err{border-color:var(--danger);border-style:solid}
.qitem.err .qs{color:var(--danger)}
.qitem .qmsg{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.linkbtn{border:0;background:none;color:var(--ink);font-size:.82rem;padding:2px 4px;text-decoration:underline}

/* list */
.group{margin-top:22px}
.group>h2{font-family:var(--f-display);font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.group>h2 .dot{width:9px;height:9px;border-radius:2px}
.fam{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin:12px 0 4px;letter-spacing:.04em}
.rows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 14px}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .n{font-weight:700;min-width:0}
.row .k{grid-column:1/-1;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;align-self:center}
.st.av{background:var(--warn-soft);color:var(--warn)}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.empty{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.empty h2{font-family:var(--f-display);font-size:1.1rem;margin:0 0 8px}
.empty p{margin:0 0 8px;color:var(--muted)}
.notice{margin-top:12px;font-size:.85rem;color:var(--muted)}

/* fiche */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);padding:14px 0 4px;font-weight:700}
.fh{margin-top:6px}
.crumb{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fh h2{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1.1;letter-spacing:-.015em;margin:6px 0 4px;text-wrap:balance}
.syn{color:var(--muted);font-size:.9rem;font-style:italic}
.key{margin-top:14px;background:var(--ink-soft);border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:1.02rem}
.key small{display:block;font-family:var(--f-mono);font-weight:500;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.sec{margin-top:18px}
.sec h3{font-family:var(--f-display);font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sec ul{margin:0;padding-left:1.1em}
.sec li{margin:3px 0}
.sec li::marker{color:var(--muted)}
.mod{margin-top:8px}
.mod ul{margin:0;padding-left:1.1em}.mod li{margin:3px 0}
.mod h4{font-family:var(--f-mono);font-size:.74rem;font-weight:500;color:var(--muted);margin:10px 0 3px;letter-spacing:.03em}
.dd{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.dd div{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr);gap:12px;padding:8px 12px;border-top:1px solid var(--line);font-size:.92rem}
.dd div:first-child{border-top:0}
.dd b{min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){.dd div{grid-template-columns:1fr;gap:2px}}
.trap{margin-top:18px;background:var(--danger-soft);border-left:3px solid var(--danger);border-radius:4px;padding:10px 14px}
.trap h3{color:var(--danger);border:0;padding:0}
.star{color:var(--star)}
.src{font-size:.86rem}
.src a{color:var(--ink);overflow-wrap:anywhere}
.ctx{font-size:.88rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:.88rem}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:var(--surface);font-weight:700}
.meta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:10px}
.revbox{width:100%;margin-top:10px;display:grid;gap:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-family:var(--f-display);margin:0;font-size:1.2rem}
.field{display:grid;gap:4px}
.field label{font-size:.8rem;color:var(--muted);font-weight:700}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{min-height:70px;resize:vertical}
.sheetbtns{display:flex;gap:8px;justify-content:flex-end}
.brand .right{display:flex;align-items:center;gap:10px}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;padding:0;color:var(--fg)}
.kind{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
/* markdown body */
.md{margin-top:16px}
.md h1,.md h2,.md h3,.md h4{font-family:var(--f-display);color:var(--ink);margin:20px 0 6px;line-height:1.2}
.md h2{font-size:1rem;letter-spacing:.06em;text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid var(--line)}
.md h3{font-size:.95rem}
.md h4{font-size:.85rem}
.md p{margin:8px 0}
.md ul,.md ol{margin:6px 0;padding-left:1.2em}
.md li{margin:3px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.md blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--ink);background:var(--ink-soft);border-radius:4px}
.md code{font-family:var(--f-mono);font-size:.85em;background:var(--sunk);padding:1px 4px;border-radius:4px}
.md a{color:var(--ink)}
.md img{display:block;border-radius:8px;margin:10px 0;cursor:zoom-in;background:#fff}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tw table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.tw th,.tw td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tw th{background:var(--sunk);font-family:var(--f-display);font-size:.8rem;border-top:0}
.wl{color:var(--ink);text-decoration:underline dotted;cursor:pointer}
.wl.dead{color:var(--muted);cursor:default;text-decoration:none}
/* images */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;cursor:zoom-in}
.gal figcaption{font-size:.8rem;color:var(--muted);padding:6px 8px;display:flex;gap:6px;justify-content:space-between;align-items:center}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(5,8,12,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:9px 6px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.addhere{display:inline-block;margin:4px 0 2px;font-size:.75rem;color:var(--muted);cursor:pointer;opacity:.75}
.addhere:hover{color:var(--ink);opacity:1}
.sech{font-family:var(--f-display);font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.gal{margin:8px 0}
.gal figcaption{flex-wrap:wrap}
.gal .cap{flex:1;min-width:0}
.gal .mv{width:100%;font-size:.75rem;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted)}
.slot{border-radius:8px;transition:background .15s, outline-color .15s;outline:2px dashed transparent;outline-offset:2px}
body.is-dragging .slot{outline-color:var(--line);min-height:28px;margin:6px 0}
.slot.over{outline-color:var(--ink);background:var(--ink-soft)}
.fig{margin:10px auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fig.sz-s{width:34%}.fig.sz-m{width:55%}.fig.sz-l{width:80%}.fig.sz-xl{width:100%}
@media (max-width:520px){.fig.sz-s{width:50%}.fig.sz-m{width:75%}.fig.sz-l,.fig.sz-xl{width:100%}}
.fig img{display:block;width:100%;height:auto;background:#fff;cursor:zoom-in}
.fig figcaption{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 8px;font-size:.8rem;color:var(--muted)}
.fig .cap{flex:1 1 100%;min-width:0}
.figact{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.handle{cursor:grab;touch-action:none;user-select:none;font-size:1.1rem;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.szs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.szb{border:0;background:var(--bg);font-size:.68rem;padding:3px 7px;font-family:var(--f-mono);color:var(--muted)}
.szb.on{background:var(--ink);color:var(--surface)}
.fig.dragging{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.85;box-shadow:0 8px 24px rgba(0,0,0,.25);margin:0}
.brand .left{display:flex;align-items:center;gap:10px;min-width:0}
.homebtn{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;font-size:.82rem;flex:none}
#hometitle{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.addbtn{padding:0 10px;gap:4px}.addbtn svg{display:none}}
.sugg{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--ink-soft);border-radius:var(--r);padding:12px 14px}
.sugg small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}.sugg b{display:block}.sugg span{display:block;color:var(--muted);font-size:.85rem}.sugg .sb{display:flex;gap:6px}
.linked{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.linked button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.85rem;color:var(--ink);font-weight:700}
.revbtn{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.revbtn .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:.74rem;display:inline-grid;place-items:center}
.revbtn .badge:empty{display:none}
.rv{margin-top:14px}
.rvtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--muted);font-size:.85rem}
.rvbar{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:8px 0 14px}.rvbar i{display:block;height:100%;background:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:12px}
.card .ss{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.card .qq{font-family:var(--f-display);font-weight:700;font-size:1.18rem;line-height:1.3}
.card .rr{border-top:1px dashed var(--line);padding-top:12px;font-size:1.02rem;line-height:1.45}
.card .cimg{display:block;width:100%;max-height:52vh;object-fit:contain;background:#000;border-radius:10px;cursor:zoom-in}
.card .tofiche{justify-self:start;border:0;background:none;color:var(--ink);font-weight:700;padding:0}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;display:grid;gap:2px;font-weight:700;font-size:.88rem}
.grades button small{font-weight:400;color:var(--muted);font-size:.74rem}
.grades .g1{color:var(--danger)}.grades .g2{color:var(--warn)}.grades .g3{color:var(--ok)}.grades .g4{color:var(--ink)}
.showbtn{width:100%;margin-top:12px;padding:13px;font-size:1rem}
.cartes{margin-top:18px}.cartes summary{cursor:pointer;font-family:var(--f-display);font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.cartes ol{padding-left:20px;margin:8px 0 0}.cartes li{margin:0 0 8px}.cartes li span{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
.offline{font-family:var(--f-mono);font-size:.66rem;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="left"><button class="homebtn" id="homebtn" hidden aria-label="Retour à l'accueil"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Accueil</button><h1 id="hometitle">Répertoire des entités</h1></span><span class="right"><span class="offline" id="offline" hidden>hors ligne</span><span class="count" id="count"></span><button class="themebtn" id="themebtn" aria-label="Changer de thème"></button></span></div>
    <div class="searchrow">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Rechercher une entité, un signe…" autocomplete="off" aria-label="Rechercher">
      </div>
      <button class="addbtn" id="addbtn" aria-label="Ficher une entité"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ficher</button>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<script>
const SURSPE = [
 ["MSK","#2E7D8C"],["Rachis","#5B7F3A"],["Neuro","#6A4FA3"],["ORL","#A0527A"],["Thorax","#3570B5"],
 ["Cardiaque","#B8443B"],["Vasculaire","#C2611F"],["Digestif","#8A6A1F"],["Uro","#2F8A6A"],["Gynéco","#B04A8C"],
 ["Sein","#C25A6E"],["Pédiatrie","#3E8FB0"],["Hémato","#8E3B46"],["Onco","#5E5E8C"],["Trauma","#7A5C3E"],
 ["Interventionnel","#40707A"],["Transversal","#6B7480"]];
const SCOLOR = Object.fromEntries(SURSPE);
const FAMILLES = ["Classification / score","Démarche / orientation","Technique / protocole","Anatomie / mesures","Tumoral","Infectieux","Inflammatoire / auto-immun","Vasculaire","Traumatique","Dégénératif","Congénital / malformatif","Métabolique / toxique","Iatrogène","Autre"];
const IMGCACHE = {};
const imgUrl = im => im && (im.url ? im.url : (im.fs && IMGCACHE[im.fs]) || "");
const COL = {fiches:"rep_fiches", queue:"rep_queue", imgs:"rep_imgs", meta:"rep_meta", srs:"rep_srs"};

/* theme */
const THEMES = [["auto","Thème : système"],["light","Thème : clair"],["dark","Thème : sombre"]];
let theme = "auto"; try{ theme = localStorage.getItem("theme") || "auto"; }catch{}
function applyTheme(){
  const r = document.documentElement;
  if(theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", theme);
  const b = document.getElementById("themebtn"); if(!b) return;
  const icon = theme==="dark" ? '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>' : theme==="light" ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>' : '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/>';
  b.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${icon}</svg>`;
  b.title = b.ariaLabel = THEMES.find(t=>t[0]===theme)[1];
}

/* markdown */
function mdHtml(md){
  if(!md) return "";
  let out;
  if(window.marked){
    try{
      marked.use({renderer:{html(h){ return esc(typeof h==="string"?h:(h&&(h.text||h.raw))||""); }}});
      out = marked.parse(String(md), {gfm:true, breaks:true});
    }catch{ out = null; }
  }
  if(out==null) out = `<p>${esc(md).replace(/\n/g,"<br>")}</p>`;
  out = out.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
  out = out.replace(/<img /g,'<img loading="lazy" ').replace(/src="fs:([A-Za-z0-9_-]+)"/g,'src="" data-fs="$1"');
  out = out.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g,(m,t,a)=>{
    const target = findByTitle(t);
    return target ? `<a class="wl" data-go="${esc(target.id)}">${esc(a||t)}</a>` : `<span class="wl dead">${esc(a||t)}</span>`;
  });
  return out.replace(/★+/g, m => `<span class="star">${m}</span>`);
}
function findByTitle(t){
  const n = norm(t.trim());
  return state.fiches.find(f=>[f.nom,f.nom_en,f.titre_obsidian,...arr(f.synonymes)].filter(Boolean).some(x=>norm(x)===n));
}

/* images */
async function compress(file){
  try{
    const bmp = await createImageBitmap(file);
    const max = 1800, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/webp",0.86));
    return blob && blob.size < file.size ? blob : file;
  }catch{ return file; }
}
function toDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
async function shrink(file){
  for(const [max,q] of [[1800,.86],[1400,.8],[1000,.75]]){
    try{
      const bmp = await createImageBitmap(file); const k = Math.min(1, max/Math.max(bmp.width,bmp.height));
      const c = document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
      c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
      const b = await new Promise(r=>c.toBlob(r,"image/webp",q)); if(b && b.size < 700000) return b;
    }catch{ break; }
  }
  return file.size < 700000 ? file : null;
}
async function uploadImages(files){
  const out = [];
  for(const f of files){
    const b = await shrink(f); if(!b) throw {code:"too_big"};
    const data = await toDataURL(b);
    const id = Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    IMGCACHE[id] = data;
    state.db.collection(COL.imgs).doc(id).set({data, created_at:new Date().toISOString()}).catch(()=>{});
    out.push({fs:id});
  }
  return out;
}
async function hydrateImgs(){
  for(const el of document.querySelectorAll("img[data-fs]")){
    const id = el.dataset.fs;
    if(!IMGCACHE[id]){ try{ const d = await state.db.collection(COL.imgs).doc(id).get(); if(d.exists) IMGCACHE[id] = d.data().data; }catch{} }
    if(IMGCACHE[id]) el.src = IMGCACHE[id];
  }
}
function lightbox(src){ $("#lbroot").innerHTML = `<div class="lightbox" data-lb="1"><img src="${esc(src)}" alt=""></div>`; }

const state = {fiches:[], queue:[], config:null, filter:null, fam:null, q:"", open:null, db:null, mcp:null, assets:null, ready:false, lastKick:0, confirmDel:false, rev:false, addKind:"entite", addFiles:[], capFor:null, mode:null, srs:{}, sess:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/★+/g, m => `<span class="star">${m}</span>`)
  .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,t,a)=>{ const g=findByTitle(t.replace(/&#39;/g,"'").replace(/&amp;/g,"&")); return g?`<a class="wl" data-go="${esc(g.id)}">${a||t}</a>`:`<span class="wl dead">${a||t}</span>`; });
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || "entite";
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- search ---------- */
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function haystack(f){
  const im = arr(f.imagerie).map(m=>[m.modalite,...arr(m.points)].join(" ")).join(" ");
  const dd = arr(f.dd).map(d=>d.entite+" "+d.distinction).join(" ");
  return norm([f.cle,...arr(f.epidemio),...arr(f.clinique),im,dd,...arr(f.pieges),...arr(f.tags),f.contenu_md||""].join(" "));
}
function score(f, q){
  const names = [f.nom, f.nom_en, f.titre_obsidian, ...arr(f.synonymes)].filter(Boolean).map(norm);
  const terms = q.split(/\s+/).filter(Boolean);
  if(names.some(n=>n===q)) return 100;
  if(names.some(n=>n.startsWith(q))) return 80;
  if(names.some(n=>n.includes(q))) return 60;
  const words = names.join(" ").split(/[^a-z0-9]+/).filter(Boolean);
  if(terms.every(t=>words.some(w=>w.startsWith(t) || (t.length>4 && lev(t,w.slice(0,t.length+1))<=1)))) return 45;
  const h = haystack(f);
  if(terms.every(t=>h.includes(t))) return 20;
  return 0;
}

/* ---------- render ---------- */
function visible(){
  let list = state.fiches;
  if(state.filter) list = list.filter(f=>f.surspe===state.filter || arr(f.tags).includes(state.filter));
  if(state.fam) list = list.filter(f=>f.famille===state.fam);
  return list;
}
function renderChips(){
  const counts = {}; state.fiches.forEach(f=>{counts[f.surspe]=(counts[f.surspe]||0)+1});
  const used = SURSPE.filter(([s])=>counts[s]);
  $("#chips").innerHTML = `<button class="chip" data-s="" aria-pressed="${!state.filter}">Tout<b>${state.fiches.length}</b></button>` +
    used.map(([s])=>`<button class="chip" data-s="${esc(s)}" aria-pressed="${state.filter===s}">${esc(s)}<b>${counts[s]}</b></button>`).join("");
  const sub = $("#subchips");
  if(state.filter){
    const fc={}; state.fiches.filter(f=>f.surspe===state.filter).forEach(f=>{fc[f.famille]=(fc[f.famille]||0)+1});
    const fams = FAMILLES.filter(x=>fc[x]).concat(Object.keys(fc).filter(x=>!FAMILLES.includes(x)));
    sub.innerHTML = fams.map(x=>`<button class="chip" data-f="${esc(x)}" aria-pressed="${state.fam===x}">${esc(x)}<b>${fc[x]}</b></button>`).join("");
    sub.hidden = fams.length<2;
  } else { sub.hidden = true; sub.innerHTML=""; }
  $("#count").textContent = state.ready ? `${state.fiches.length} fiche${state.fiches.length>1?"s":""}` : "";
}
function rowHtml(f){
  const k = (f.cle||"").replace(/\*\*/g,"");
  return `<button class="row" data-id="${esc(f.id)}"><span class="n">${esc(f.nom)}${f.type==="memo"?'<span class="kind">mémo</span>':f.type==="comparatif"?'<span class="kind">gamme</span>':f.type==="signe"?'<span class="kind">signe</span>':""}</span>${statusPill(f)}<span class="k">${esc(k)}</span></button>`;
}
function statusPill(f){return f.statut==="verifiee"?`<span class="st ok">vérifiée</span>`:`<span class="st av">à vérifier</span>`}
function queueHtml(){
  const sugg = state.queue.filter(x=>x.status==="suggestion");
  const sHtml = sugg.map(x=>`<div class="sugg"><div><small>Gamme proposée</small><b>${esc(x.nom)}</b>${arr(x.entites_noms).length?`<span>${arr(x.entites_noms).map(esc).join(" · ")}</span>`:""}</div><div class="sb"><button class="btn primary" data-sugok="${esc(x.id)}">Créer</button><button class="btn" data-sugno="${esc(x.id)}">Ignorer</button></div></div>`).join("");
  const items = state.queue.filter(x=>x.app!=="quotidien" && !["done","suggestion","ignored"].includes(x.status));
  if(!items.length) return sHtml;
  return `<div class="queue" aria-label="En préparation">` + items.map(x=>{
    const lbl = x.type==="revise" ? `Correction · ${esc(x.nom)}` : x.type==="cartes" ? `Cartes · ${esc(x.nom)}` : x.type==="cartes_lot" ? `Cartes de révision · fiches existantes${x.message?` (${esc(x.message)})`:""}` : esc(x.nom || rpName(x.url) || x.url);
    if(x.status==="error") return `<div class="qitem err"><span class="qn">${lbl}<span class="qmsg">${esc(x.message||"Échec de la rédaction.")}</span></span><button class="linkbtn" data-retry="${esc(x.id)}">Relancer</button><button class="linkbtn" data-drop="${esc(x.id)}">Retirer</button></div>`;
    const s = x.status==="processing" ? "rédaction en cours" : "en file";
    if(x.type==="cartes_lot") return `<div class="qitem"><span class="pulse"></span><span class="qn">${lbl}</span><span class="qs">${s}</span></div>`;
    return `<div class="qitem"><span class="pulse"></span><span class="qn">${lbl}</span><span class="qs">${s}</span></div>`;
  }).join("") + `</div>` + sHtml;
}
function renderList(){
  const main = $("#main");
  if(!state.ready){ main.innerHTML = `<div class="empty"><h2>Chargement…</h2><p>Connexion à ton répertoire.</p></div>`; return; }
  if(!state.db){ main.innerHTML = `<div class="empty"><h2>Première ouverture sans réseau</h2><p>Ouvre l'appli une fois avec du réseau : ensuite elle marchera hors ligne.</p></div>`; return; }
  let html = queueHtml();
  const q = norm(state.q.trim());
  if(q){
    const res = visible().map(f=>[f,score(f,q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||a[0].nom.localeCompare(b[0].nom,"fr"));
    html += res.length ? `<section class="group"><h2>${res.length} résultat${res.length>1?"s":""}</h2><div class="rows">${res.map(x=>rowHtml(x[0])).join("")}</div></section>`
      : `<div class="empty"><h2>Rien pour « ${esc(state.q)} »</h2><p>Pas encore de fiche sur cette entité.</p><button class="btn primary" data-addq="1">Ficher « ${esc(state.q.trim())} »</button></div>`;
    main.innerHTML = html; return;
  }
  const list = visible();
  if(!state.fiches.length){
    html += `<div class="empty"><h2>Aucune fiche pour l'instant</h2><p>Tape le nom d'une entité croisée en stage ou sur un cas, avec si tu veux deux mots de contexte. La fiche (épidémio, clinique, imagerie, DD, pièges) est rédigée à partir du topo Radiopaedia et apparaît ici toute seule.</p><button class="btn primary" data-add="1">Ficher une première entité</button></div>`;
    main.innerHTML = html; return;
  }
  const bySurspe = {};
  list.forEach(f=>{(bySurspe[f.surspe]=bySurspe[f.surspe]||[]).push(f)});
  const order = SURSPE.map(x=>x[0]).filter(s=>bySurspe[s]).concat(Object.keys(bySurspe).filter(s=>!SCOLOR[s]));
  html += order.map(s=>{
    const byFam = {}; bySurspe[s].forEach(f=>{(byFam[f.famille||"Autre"]=byFam[f.famille||"Autre"]||[]).push(f)});
    const fams = FAMILLES.filter(x=>byFam[x]).concat(Object.keys(byFam).filter(x=>!FAMILLES.includes(x)));
    return `<section class="group"><h2><span class="dot" style="background:${SCOLOR[s]||"#6B7480"}"></span>${esc(s)}</h2>` +
      fams.map(fa=>`<div class="fam">${esc(fa)}</div><div class="rows">${byFam[fa].sort((a,b)=>a.nom.localeCompare(b.nom,"fr")).map(rowHtml).join("")}</div>`).join("") + `</section>`;
  }).join("");
  if(state.filter && !list.length) html += `<div class="empty"><p>Aucune fiche dans ce filtre.</p></div>`;
  main.innerHTML = html;
}
function ficheSections(f){
  // [{key,label,html}] dans l'ordre d'affichage
  const out=[];
  const list=(items)=>`<ul>${arr(items).map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;
  if(f.cle) out.push({key:"cle",label:"À retenir",html:`<div class="key"><small>${f.type==="signe"?"Définition":"À retenir"}</small>${fmt(f.cle)}</div>`});
  if(f.mecanisme) out.push({key:"mecanisme",label:"Mécanisme",html:`<section class="sec"><h3>Mécanisme</h3><p style="margin:0">${fmt(f.mecanisme)}</p></section>`});
  if(arr(f.causes).length) out.push({key:"causes",label:"Causes",html:`<section class="sec"><h3>Causes</h3><div class="dd">${arr(f.causes).map(d=>{ const g=findByTitle(d.entite||""); return `<div><b>${g?`<a class="wl" data-go="${esc(g.id)}">${esc(d.entite)}</a>`:fmt(d.entite)}</b><span>${fmt(d.precision||"")}</span></div>`; }).join("")}</div></section>`});
  if(arr(f.epidemio).length) out.push({key:"epidemio",label:"Épidémiologie",html:`<section class="sec"><h3>Épidémiologie</h3>${list(f.epidemio)}</section>`});
  if(arr(f.clinique).length) out.push({key:"clinique",label:"Clinique",html:`<section class="sec"><h3>Clinique</h3>${list(f.clinique)}</section>`});
  arr(f.imagerie).forEach((m,k)=>out.push({key:"imagerie:"+k,label:"Imagerie — "+(m.modalite||""),html:`${k===0?'<h3 class="sech">Imagerie</h3>':""}<div class="mod"><h4>${esc(m.modalite)}</h4>${list(m.points)}</div>`}));
  if(arr(f.dd).length) out.push({key:"dd",label:"Diagnostics différentiels",html:`<section class="sec"><h3>Diagnostics différentiels</h3><div class="dd">${arr(f.dd).map(d=>`<div><b>${fmt(d.entite)}</b><span>${fmt(d.distinction)}</span></div>`).join("")}</div></section>`});
  if(arr(f.pieges).length) out.push({key:"pieges",label:"Pièges",html:`<section class="trap sec"><h3>Pièges</h3>${list(f.pieges)}</section>`});
  if(f.contenu_md){
    const parts=String(f.contenu_md).split(/\n(?=##\s)/);
    parts.forEach((p,k)=>{ const h=(p.match(/^##\s+(.+)/)||[])[1]; out.push({key:"md:"+k,label:h?h.replace(/[*_`]/g,"").trim():(k===0?"Début du contenu":"Bloc "+(k+1)),html:`<div class="md">${mdHtml(p)}</div>`}); });
  }
  out.push({key:"fin",label:"Fin de fiche",html:""});
  return out;
}
function imgSection(im, keys){ const s=im.section; return s && keys.includes(s) ? s : "fin"; }
function figures(f, key, keys, secs){
  const items = arr(f.images).map((im,i)=>[im,i]).filter(([im])=>imgSection(im,keys)===key);
  return items.map(([im,i])=>{ const sz = im.size||"l";
    return `<figure class="fig sz-${esc(sz)}" data-idx="${i}"><img src="${esc(imgUrl(im))}" ${im.fs?`data-fs="${esc(im.fs)}"`:""} alt="${esc(im.legende||"")}" loading="lazy" data-zoom="1">
    <figcaption>${state.capFor===i?`<input id="capin" value="${esc(im.legende||"")}" placeholder="Légende" style="flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"><button class="linkbtn" data-capsave="${i}">OK</button>`
    :`<span class="cap">${esc(im.legende||"")}</span>
      <span class="figact"><span class="handle" data-drag="${i}" title="Glisser pour déplacer" aria-label="Déplacer">⠿</span>
      <span class="szs">${["s","m","l","xl"].map(z=>`<button class="szb${z===sz?" on":""}" data-size="${z}" data-i="${i}" aria-label="Taille ${z.toUpperCase()}">${z.toUpperCase()}</button>`).join("")}</span>
      <button class="linkbtn" data-cap="${i}">Légende</button><button class="linkbtn" data-imgdel="${i}">Retirer</button></span>`}</figcaption></figure>`; }).join("");
}
function renderFiche(){
  const f = state.fiches.find(x=>x.id===state.open);
  const main = $("#main");
  if(!f){ if(!state.fiches.length){ main.innerHTML=`<div class="empty"><h2>Chargement…</h2></div>`; return; } state.open=null; return render(); }
  const secs = ficheSections(f), keys = secs.map(s=>s.key);
  const addHere = k => `<label class="addhere" for="imgup" data-sec="${esc(k)}">+ image ici</label>`;
  const body = secs.map(s=>{
    const figs = figures(f, s.key, keys, secs);
    if(s.key==="fin") return `<div class="slot" data-slot="fin">${figs?`<h3 class="sech">Images</h3>`:""}${figs}</div>`;

  }).join("");
  const src = arr(f.sources).length ? `<section class="sec src"><h3>Sources</h3><ul>${arr(f.sources).map(s=>`<li>${/^https:\/\//.test(s.url||"")?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.titre||s.url)}</a>`:esc(s.titre||"")}</li>`).join("")}</ul></section>` : "";
  const ctx = f.contexte ? `<section class="sec ctx"><h3>Croisée où</h3><p style="margin:0">${fmt(f.contexte)}</p></section>` : "";
  const d = s => s ? new Date(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}) : "";
  const pendingRev = state.queue.some(x=>x.type==="revise" && x.fiche_id===f.id && x.status!=="done");
  const pendingCards = state.queue.some(x=>x.type==="cartes" && x.fiche_id===f.id && x.status!=="done");
  main.innerHTML = `
    <button class="back" data-back="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Répertoire</button>
    <article>
      <div class="fh">

/* ---------- révision espacée (FSRS-4.5) ---------- */
const W=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DECAY=-0.5, FACTOR=19/81, RET=0.9, DAY=864e5, NEW_PER_DAY=15;
const clampD=d=>Math.min(10,Math.max(1,d));
const D0=g=>clampD(W[4]-Math.exp(W[5]*(g-1))+1);
const retr=(t,s)=>Math.pow(1+FACTOR*t/s,DECAY);
const ivlDays=s=>Math.max(1,Math.round(s/FACTOR*(Math.pow(RET,1/DECAY)-1)));
function nextState(c,g,now){
  let s,d; const fresh=!c||!c.reps;
  if(fresh){ s=W[g-1]; d=D0(g); }
  else{
    const t=Math.max(0,(now-c.last)/DAY), r=retr(t,c.s);
    d=clampD(W[7]*D0(4)+(1-W[7])*(c.d-W[6]*(g-3)));
    s = g===1 ? Math.min(c.s, W[11]*Math.pow(d,-W[12])*(Math.pow(c.s+1,W[13])-1)*Math.exp(W[14]*(1-r)))
              : c.s*(Math.exp(W[8])*(11-d)*Math.pow(c.s,-W[9])*(Math.exp(W[10]*(1-r))-1)*(g===2?W[15]:1)*(g===4?W[16]:1)+1);
  }
  let days = g===1 ? 0 : ivlDays(s);
  if(fresh) days = [0,0,0,1,4][g];               // étapes d'apprentissage façon Anki : 10 min / 6 min (même séance) / 1 j / 4 j
  const soon = g===1 || (fresh && g===2);
  const due = soon ? now+(g===1?10:6)*60e3 : now+days*DAY;
  return {s,d,last:now,due,days,soon,reps:(c?.reps||0)+1,lapses:(c?.lapses||0)+(g===1&&!fresh?1:0),first:c?.first||now};
}
const dayKey=t=>new Date(t).toDateString();
function cardPool(){
  const out=[];
  visible().forEach(f=>arr(f.cartes).forEach((c,i)=>{ if(c&&c.q) out.push({key:f.id+"__"+(c.id||("c"+i)), f, c}); }));
  return out;
}
function dueInfo(){
  const now=Date.now(), pool=cardPool();
  const due=pool.filter(x=>state.srs[x.key] && state.srs[x.key].due<=now).sort((a,b)=>state.srs[a.key].due-state.srs[b.key].due);
  const today=dayKey(now);
  const newToday=Object.values(state.srs).filter(v=>v.first && dayKey(v.first)===today).length;
  const fresh=pool.filter(x=>!state.srs[x.key]).sort((a,b)=>String(b.f.created_at||"").localeCompare(String(a.f.created_at||""))||String(a.key).localeCompare(String(b.key)));
  return {pool, due, fresh, newLeft:Math.max(0,NEW_PER_DAY-newToday)};
}
function updateBadge(){
  const b=$("#revcount"); if(!b) return;
  if(!state.srsReady){ b.textContent=""; return; }
  const saveF=state.filter, saveFam=state.fam; state.filter=null; state.fam=null;
  const i=dueInfo(); state.filter=saveF; state.fam=saveFam;
  const n=i.due.length+Math.min(i.newLeft,i.fresh.length);
  b.textContent = n ? (n>99?"99+":String(n)) : "";
}
function startReview(ficheId){
  state.sessFiche = typeof ficheId==="string" ? ficheId : null;
  state.mode="review"; state.open=null; state.q=""; const qi=$("#q"); if(qi) qi.value="";

function buildSession(){
  if(state.sessFiche){
    const f=state.fiches.find(x=>x.id===state.sessFiche);
    const items=f?arr(f.cartes).map((c,i)=>({key:f.id+"__"+(c.id||("c"+i)), f, c})).filter(x=>x.c&&x.c.q):[];
    state.sess={items, idx:0, shown:false, done:0, again:0, total:items.length, poolSize:items.length, fiche:f};
    return;
  }
  const i=dueInfo();
  const items=[...i.due, ...i.fresh.slice(0,i.newLeft)];
  // mélange léger des nouvelles cartes d'une même fiche pour éviter d'enchaîner les réponses
  state.sess={items, idx:0, shown:false, done:0, again:0, total:items.length, poolSize:i.pool.length};
}
function cardImg(x){
  const c=x.c; if(!c.img) return "";
  const im = typeof c.img==="string" ? (arr(x.f.images).find(m=>m.fs===c.img) || {fs:c.img}) : c.img;
  return `<img class="cimg" src="${esc(imgUrl(im))}" ${im.fs?`data-fs="${esc(im.fs)}"`:""} alt="" data-zoom="1">`;
}
const fmtMulti = s => String(s??"").split(/\n+/).map(fmt).join("<br>");
function ivlLabel(days, g, soon){ if(soon) return g===1?"10 min":"6 min"; if(days<30) return days+" j"; if(days<365) return Math.round(days/30)+" mois"; return (days/365).toFixed(1).replace(".0","")+" an"; }
function renderReview(){
  const main=$("#main");
  if(!state.ready || !state.srsReady){ main.innerHTML=`<div class="empty"><h2>Chargement…</h2></div>`; return; }
  if(!state.sess) buildSession();
  const S=state.sess;
  const back=`<button class="back" data-back="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Répertoire</button>`;
  const scope = state.sessFiche ? ` · ${esc(state.sess?.fiche?.nom||"")}` : state.filter ? ` en ${esc(state.filter)}${state.fam?` › ${esc(state.fam)}`:""}` : "";
  const withoutCards = state.fiches.filter(f=>!arr(f.cartes).length).length;
  const lotPending = state.queue.some(x=>x.type==="cartes_lot"&&x.status!=="done");
  const lot = withoutCards ? `<p style="margin:14px 0 0;color:var(--muted);font-size:.9rem">${withoutCards} fiche${withoutCards>1?"s":""} sans cartes. ${lotPending?"Génération en cours…":`<button class="linkbtn" data-lotgo="1">Créer leurs cartes</button>`}</p>` : "";
  if(state.sessFiche && S.idx>=S.items.length && S.fiche){
    main.innerHTML = back + `<div class="empty"><h2>Fiche « ${esc(S.fiche.nom)} » testée</h2><p>${S.done} réponse${S.done>1?"s":""}${S.again?`, dont ${S.again} à revoir`:""}. Les cartes reviendront d'elles-mêmes dans « Réviser » au bon moment.</p><button class="btn primary" data-tofiche="${esc(S.fiche.id)}">Retour à la fiche</button> <button class="btn" data-again="1">Réviser le reste du jour</button></div>`;
    return;
  }
  if(!S.items.length || S.idx>=S.items.length){
    const i=dueInfo(); const next=i.pool.map(x=>state.srs[x.key]&&state.srs[x.key].due).filter(Boolean).sort((a,b)=>a-b)[0];
    const msg = !S.poolSize ? `<h2>Pas encore de cartes${scope}</h2><p>Les cartes sont créées avec chaque nouvelle fiche. Ajoute une entité avec « Ficher » (un lien Radiopaedia suffit).</p>`
      : S.done ? `<h2>Séance terminée</h2><p>${S.done} carte${S.done>1?"s":""} revue${S.done>1?"s":""}${S.again?`, dont ${S.again} à revoir`:""}.${next?` Prochaine révision ${new Date(next).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}.`:""}</p>`
      : `<h2>Rien à réviser${scope} pour l'instant</h2><p>${next?`Prochaine carte ${new Date(next).toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}.`:""} Le quota de ${NEW_PER_DAY} nouvelles cartes par jour se recharge demain.</p>`;
    main.innerHTML = back + `<div class="empty">${msg}${S.done&&i.due.length?`<button class="btn primary" data-again="1">Continuer (${i.due.length} carte${i.due.length>1?"s":""})</button>`:""}${lot}</div>`;
    return;
  }
  const x=S.items[S.idx], c=x.c, cur=state.srs[x.key], now=Date.now();
  const left=S.items.length-S.idx;
  const color=SCOLOR[x.f.surspe]||"var(--muted)";
  const grades = [[1,"Pas trouvé"],[2,"Partiellement trouvé"],[3,"Trouvé en analysant"],[4,"Évident"]].map(([g,l])=>{ const n=nextState(cur,g,now); return `<button class="g${g}" data-grade="${g}">${l}<small>${ivlLabel(n.days,g,n.soon)}</small></button>`; }).join("");
  main.innerHTML = back + `<div class="rv">
    <div class="rvtop"><span>${left} restante${left>1?"s":""}${scope}</span><span>${cur?"révision":"nouvelle"}</span></div>
    <div class="rvbar"><i style="width:${Math.round(100*S.idx/Math.max(1,S.items.length))}%"></i></div>
    <div class="card">
      <div class="ss" style="color:${color}">${esc(x.f.surspe||"")}${c.type==="image"||!S.shown?"":` · ${esc(x.f.nom)}`}</div>
      <div class="qq">${fmtMulti(c.q)}</div>
      ${cardImg(x)}
      ${S.shown?`<div class="rr">${fmtMulti(c.r)}</div><button class="tofiche" data-tofiche="${esc(x.f.id)}">Ouvrir la fiche « ${esc(x.f.nom)} » ›</button>`:""}
    </div>
    ${S.shown?`<div class="grades">${grades}</div>`:`<button class="btn primary showbtn" data-show="1">Voir la réponse</button>`}
  </div>`;
  hydrateImgs();
}
function gradeCard(g){
  const S=state.sess; if(!S) return; const x=S.items[S.idx]; if(!x) return;
  const now=Date.now(); const n=nextState(state.srs[x.key],g,now);
  const rec={fiche_id:x.f.id, card:x.c.id||"", s:n.s, d:n.d, last:n.last, due:n.due, reps:n.reps, lapses:n.lapses, first:n.first};
  state.srs[x.key]=rec;
  state.db.collection(COL.srs).doc(x.key).set(rec).catch(()=>toast("Progression non enregistrée."));
  S.done++; if(n.soon){ if(g===1) S.again++; S.items.splice(Math.min(S.items.length,S.idx+(g===1?4:8)),0,x); }
  S.idx++; S.shown=false; renderReview(); updateBadge(); window.scrollTo(0,0);
}
document.addEventListener("keydown", e=>{
  if(state.mode!=="review"||!state.sess||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) return;
  if(e.key===" "&&!state.sess.shown){ e.preventDefault(); state.sess.shown=true; renderReview(); }
  else if(state.sess.shown && ["1","2","3","4"].includes(e.key)) gradeCard(+e.key);
});
function linkedHtml(f){
  if(f.type!=="comparatif") return "";
  const seen=new Set(), out=[];
  arr(f.entites).forEach(id=>{ const e=state.fiches.find(x=>x.id===id); if(e&&!seen.has(e.id)){ seen.add(e.id); out.push(`<button data-go="${esc(e.id)}">${esc(e.nom)} ›</button>`); } });
  arr(f.entites_noms).forEach(n=>{ const e=findByTitle(n); if(e&&!seen.has(e.id)){ seen.add(e.id); out.push(`<button data-go="${esc(e.id)}">${esc(e.nom)} ›</button>`); }
    else if(!e) out.push(`<button disabled style="opacity:.55;color:var(--muted)">${esc(n)} · fiche à venir</button>`); });
  return out.length?`<div class="linked">${out.join("")}</div>`:"";
}
function cartesHtml(f){
  const cs=arr(f.cartes); if(!cs.length) return "";
  return `<details class="cartes"><summary>Cartes de révision (${cs.length})</summary><ol>${cs.map(c=>`<li>${fmt(c.q)}<span>${fmt(c.r)}</span></li>`).join("")}</ol></details>`;
}
function rpName(u){
  const m=String(u||"").match(/radiopaedia\.org\/(?:articles|cases)\/([^/?#]+)/i); if(!m) return "";
  const t=decodeURIComponent(m[1]).replace(/-\d+$/,"").replace(/-/g," ").trim();
  return t ? t.charAt(0).toUpperCase()+t.slice(1) : "";
}

applyTheme();
try{ const h=decodeURIComponent((location.hash||"").slice(1)); if(h==="reviser") state.mode="review"; else if(h) state.open=h; }catch{}
render();
function netState(){ const o=$("#offline"); if(o) o.hidden = navigator.onLine; }
addEventListener("online",netState); addEventListener("offline",netState); netState();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
async function seedIfNeeded(db){
  try{
    const meta = await db.collection(COL.meta).doc("seed").get();
    if(meta.exists && meta.data().v>=1) return;
    if(!navigator.onLine || meta.metadata.fromCache) return;
    const r = await fetch("seed.json",{cache:"no-store"}); if(!r.ok) return;
    const seed = await r.json();
    const ids = Object.keys(seed.fiches);
    for(let k=0;k<ids.length;k+=400){
      const b = db.batch();
      ids.slice(k,k+400).forEach(id=>b.set(db.collection(COL.fiches).doc(id), seed.fiches[id], {merge:true}));
      await b.commit();
    }
    await db.collection(COL.meta).doc("seed").set({v:seed.v, at:new Date().toISOString()});
    toast(`${ids.length} fiches importées`);
  }catch(e){ console.error("seed",e); toast("Import initial impossible : "+(e&&e.code||"erreur")); }
}
(function(){
  if(!window.firebase){ state.ready=true; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  state.db = db;
  db.collection(COL.fiches).onSnapshot(s=>{ state.fiches = s.docs.map(d=>({id:d.id,...d.data()})); state.ready=true; if(state.mode==="review" && state.sess){ updateBadge(); renderChips(); } else render(); }, e=>{ console.error(e); state.ready=true; render(); toast("Lecture des fiches impossible : "+(e&&e.code||"erreur")); });
  db.collection(COL.queue).onSnapshot(s=>{ state.queue = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))); if(state.mode!=="review") state.open ? renderFiche() : renderList(); }, ()=>{});
  db.collection(COL.srs).onSnapshot(s=>{ state.srs = Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); state.srsReady=true; if(state.mode==="review" && !state.sess) renderReview(); updateBadge(); }, ()=>{ state.srsReady=true; });
  seedIfNeeded(db);
})();
</script>
