<!doctype html><meta charset="utf8"><body style="font-family:system-ui;background:#fff;padding:16px">
<style>svg.jhand{height:330px;width:auto;display:block}</style>
<div id="spine"></div><div style="font-size:11px;color:#888">RACHIS (cervical atteint, dorso-lomb possible, SI atteint)</div>
<script>
var BONE="#eef2f2",EDGE="#aeb9ba";
function _bN(n){return (+n).toFixed(1);}
function _grad(id){return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f5f6"/><stop offset="1" stop-color="#e4ebec"/></linearGradient></defs>';}
function _dot(x,y,lv,r){r=r||5.4;if(lv===''){return '<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="#fff" stroke="#cdd6d7" stroke-width="1.2"/>';}var fill={p:'#0f7a70',s:'#ffffff',e:'#ffffff'}[lv],st={p:'#0b5a53',s:'#0f7a70',e:'#c0392b'}[lv];return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+st+'" stroke-width="'+(lv=='p'?1.4:2.3)+'"/>';}
function _st(l){return l=='p'?' fx':'';}
function _axialSvg(prim,sec){function L(k){return prim.indexOf(k)>=0?'p':(sec.indexOf(k)>=0?'s':'');}
 var cerv=L('rachis_cervical'),dl=L('rachis_dorsolomb'),si=L('sacro_iliaque'),sy=L('symphyse_pubienne');
 var B='',N='',V=[],n=17;
 for(var i=0;i<n;i++){var t=i/(n-1);var x=80+Math.sin(t*Math.PI*1.1)*15-t*3;var y=24+t*236;var w=8+t*9;var h=8+t*4;V.push([x,y,w,h,t]);}
 for(var i=0;i<V.length;i++){var v=V[i];
  if(i<V.length-1){var v2=V[i+1];B+='<line x1="'+_bN(v[0]-v[2])+'" y1="'+_bN((v[1]+v2[1])/2)+'" x2="'+_bN(v[0]+v[2])+'" y2="'+_bN((v[1]+v2[1])/2)+'" stroke="#d8e0e0" stroke-width="2.6" stroke-linecap="round"/>';}
  B+='<rect x="'+_bN(v[0]-v[2])+'" y="'+_bN(v[1]-v[3]/2)+'" width="'+_bN(v[2]*2)+'" height="'+_bN(v[3])+'" rx="2.5" fill="'+BONE+'" stroke="'+EDGE+'" stroke-width="1.1"/>';
  B+='<path d="M'+_bN(v[0]-v[2])+' '+_bN(v[1])+' L'+_bN(v[0]-v[2]-6-v[4]*4)+' '+_bN(v[1]+2)+' L'+_bN(v[0]-v[2])+' '+_bN(v[1]+v[3]*0.34)+' Z" fill="'+BONE+'" stroke="'+EDGE+'" stroke-width="0.9"/>';}
 var last=V[16],sx=last[0],sy0=last[1]+10;
 B+='<path d="M'+_bN(sx-13)+' '+_bN(sy0)+' Q'+_bN(sx+14)+' '+_bN(sy0+22)+' '+_bN(sx-2)+' '+_bN(sy0+44)+' Q'+_bN(sx-20)+' '+_bN(sy0+26)+' '+_bN(sx-14)+' '+_bN(sy0)+' Z" fill="'+BONE+'" stroke="'+EDGE+'" stroke-width="1.1"/>';
 B+='<path d="M'+_bN(sx+6)+' '+_bN(sy0+30)+' Q'+_bN(sx+30)+' '+_bN(sy0+34)+' '+_bN(sx+26)+' '+_bN(sy0+48)+'" fill="none" stroke="'+EDGE+'" stroke-width="3" stroke-linecap="round"/>';
 function nd(x,y,lv,lab){return '<g class="jhit" data-tip="'+lab+'">'+_dot(x,y,lv,5)+'</g>';}
 N+=nd(V[3][0],V[3][1],cerv,'c')+nd(V[10][0],V[10][1],dl,'d')+nd(sx-2,sy0+22,si,'si')+nd(sx+26,sy0+44,sy,'sy');
 var LB='<g font-size="9" fill="#8a94a2" font-family="system-ui" text-anchor="start"><text x="'+(V[3][0]+16)+'" y="'+(V[3][1]+3)+'">cervical</text><text x="'+(V[10][0]+16)+'" y="'+(V[10][1]+3)+'">dorso-lomb.</text><text x="'+(sx+8)+'" y="'+(sy0+20)+'">SI</text><text x="'+(sx+30)+'" y="'+(sy0+50)+'">symphyse</text></g>';
 return '<svg class="jhand" viewBox="0 0 175 330" xmlns="http://www.w3.org/2000/svg">'+_grad('gb')+B+N+LB+'</svg>';}
document.getElementById('spine').innerHTML=_axialSvg(['rachis_cervical','sacro_iliaque'],['rachis_dorsolomb']);
</script></body>
