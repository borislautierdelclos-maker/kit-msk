<!doctype html><meta charset="utf-8"><style>
body{background:#f4f6f7;font-family:system-ui;margin:0;padding:16px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e2e8ea;border-radius:12px;padding:12px;width:430px}
.schemas{display:flex;gap:14px;align-items:flex-start}
.sch{text-align:center;flex:1}
.sch svg{width:100%;height:auto;max-height:230px}
.schcap{font-size:11px;color:#8a94a2;margin-top:4px}
h3{margin:4px 0 10px;font-size:14px;color:#1f3a5f}
</style>
<div id="app"></div>
<script>
var HL="#0f7a70", HLsoft="#bfe3dd";

/* ---------- richer limb cross-section ---------- */
function stMap(plan){
 function on(k){var a=k.replace('plan_',''),pp=(plan||[]);return pp.indexOf(k)>=0||pp.indexOf(a)>=0;}
 var SKIN='#e0b48a',SKINk='#c48a5e',FAT='#f4e4a6',FATk='#dcc877',FASC='#b9c3c4',
     MUS='#bd6f62',MUSk='#9c574c',SEP='#d79a8f',BONE='#efe8d6',BONEk='#cfc3a1',MED='#f8f3e6',
     ART='#c0504d',VEN='#5b7fa6',NRV='#e0b84a';
 var cx=90,cy=88;
 var s='<svg viewBox="0 0 180 190" xmlns="http://www.w3.org/2000/svg">';
 // skin
 s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="78" ry="72" fill="'+SKIN+'" stroke="'+(on('plan_dermique')?HL:SKINk)+'" stroke-width="'+(on('plan_dermique')?3.2:1.6)+'"/>';
 // subcutaneous fat
 s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="71" ry="65" fill="'+FAT+'" stroke="'+(on('plan_sous_cutane')?HL:FATk)+'" stroke-width="'+(on('plan_sous_cutane')?3:1.1)+'"/>';
 // deep fascia (thin ring)
 s+='<ellipse cx="'+cx+'" cy="'+(cy+1)+'" rx="60" ry="55" fill="none" stroke="'+FASC+'" stroke-width="2.2"/>';
 // muscle mass
 var mh=(on('plan_intramusculaire')||on('plan_profond'));
 s+='<ellipse cx="'+cx+'" cy="'+(cy+1)+'" rx="58" ry="53" fill="'+MUS+'" stroke="'+(mh?HL:MUSk)+'" stroke-width="'+(mh?3:1)+'"/>';
 // intermuscular septa -> 3 compartments
 s+='<path d="M'+cx+','+(cy-52)+' Q'+(cx+6)+','+(cy+1)+' '+cx+','+(cy+54)+'" fill="none" stroke="'+SEP+'" stroke-width="1.6"/>';
 s+='<path d="M'+(cx-50)+','+(cy+24)+' Q'+(cx-8)+','+(cy+6)+' '+(cx+2)+','+(cy+40)+'" fill="none" stroke="'+SEP+'" stroke-width="1.3" opacity=".8"/>';
 // muscle fiber hint (subtle)
 for(var i=-2;i<=2;i++){s+='<line x1="'+(cx-38)+'" y1="'+(cy-30+i*14)+'" x2="'+(cx-14)+'" y2="'+(cy-26+i*14)+'" stroke="'+MUSk+'" stroke-width=".5" opacity=".35"/>';}
 // bone (eccentric, deep)
 var bx=cx+4,by=cy+20,jh=on('plan_juxta_articulaire');
 s+='<circle cx="'+bx+'" cy="'+by+'" r="21" fill="'+BONE+'" stroke="'+(jh?HL:BONEk)+'" stroke-width="'+(jh?3.4:3)+'"/>';
 s+='<circle cx="'+bx+'" cy="'+by+'" r="12.5" fill="'+MED+'" stroke="'+BONEk+'" stroke-width="1"/>';
 // neurovascular bundle
 var nh=on('plan_peri_nerveux');
 var nx=cx-34,ny=cy+30;
 if(nh)s+='<circle cx="'+nx+'" cy="'+ny+'" r="13" fill="none" stroke="'+HL+'" stroke-width="2.4" stroke-dasharray="3 2"/>';
 s+='<circle cx="'+(nx-4)+'" cy="'+ny+'" r="4" fill="'+ART+'"/>';
 s+='<circle cx="'+(nx+4)+'" cy="'+(ny-2)+'" r="4.5" fill="'+VEN+'"/>';
 s+='<circle cx="'+(nx+2)+'" cy="'+(ny+6)+'" r="3" fill="'+NRV+'"/>';
 // labels
 s+='<g font-size="8.5" font-family="system-ui" fill="#6b7580">';
 s+='<text x="'+cx+'" y="12" text-anchor="middle">peau</text>';
 s+='<text x="162" y="40" text-anchor="end">graisse</text>';
 s+='<text x="'+(cx-40)+'" y="'+(cy-40)+'" text-anchor="middle">muscle</text>';
 s+='<text x="'+bx+'" y="'+(by+2)+'" text-anchor="middle" font-size="7.5" fill="#9a8f6b">os</text>';
 s+='<text x="'+(nx)+'" y="'+(ny+22)+'" text-anchor="middle" font-size="7.5">paquet VN</text>';
 s+='</g>';
 return s+'</svg>';
}

/* ---------- body homunculus (soft-tissue regions) ---------- */
function bodyMap(R){
 function on(){for(var i=0;i<arguments.length;i++)if(R[arguments[i]])return true;return false;}
 var SIL='#dfe6e7',STK='#c2cccd',H='#0f7a70',Hf='#9ed6cd';
 function f(k){return on.apply(null,[].slice.call(arguments))?Hf:SIL;}
 function sk(k){return on.apply(null,[].slice.call(arguments))?H:STK;}
 var s='<svg viewBox="0 0 150 330" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round">';
 // head + neck
 s+='<circle cx="75" cy="26" r="17" fill="'+f('tete')+'" stroke="'+sk('tete')+'" stroke-width="2"/>';
 s+='<rect x="68" y="41" width="14" height="10" rx="4" fill="'+f('tete')+'" stroke="'+sk('tete')+'" stroke-width="1.6"/>';
 // trunk (paroi/tronc)
 s+='<path d="M55,52 Q75,47 95,52 L99,120 Q75,130 51,120 Z" fill="'+f('tronc')+'" stroke="'+sk('tronc')+'" stroke-width="2"/>';
 // shoulders
 s+='<circle cx="50" cy="60" r="9" fill="'+f('epaule')+'" stroke="'+sk('epaule')+'" stroke-width="1.8"/>';
 s+='<circle cx="100" cy="60" r="9" fill="'+f('epaule')+'" stroke="'+sk('epaule')+'" stroke-width="1.8"/>';
 // upper arms
 s+='<path d="M44,66 L34,112 L44,116 L54,70 Z" fill="'+f('bras')+'" stroke="'+sk('bras')+'" stroke-width="1.6"/>';
 s+='<path d="M106,66 L116,112 L106,116 L96,70 Z" fill="'+f('bras')+'" stroke="'+sk('bras')+'" stroke-width="1.6"/>';
 // forearms
 s+='<path d="M34,114 L30,156 L39,158 L45,118 Z" fill="'+f('avant_bras')+'" stroke="'+sk('avant_bras')+'" stroke-width="1.6"/>';
 s+='<path d="M116,114 L120,156 L111,158 L105,118 Z" fill="'+f('avant_bras')+'" stroke="'+sk('avant_bras')+'" stroke-width="1.6"/>';
 // hands
 s+='<ellipse cx="33" cy="167" rx="7" ry="10" fill="'+f('main')+'" stroke="'+sk('main')+'" stroke-width="1.6"/>';
 s+='<ellipse cx="117" cy="167" rx="7" ry="10" fill="'+f('main')+'" stroke="'+sk('main')+'" stroke-width="1.6"/>';
 // thighs
 s+='<path d="M55,122 L50,196 L66,198 L72,126 Z" fill="'+f('cuisse')+'" stroke="'+sk('cuisse')+'" stroke-width="1.8"/>';
 s+='<path d="M95,122 L100,196 L84,198 L78,126 Z" fill="'+f('cuisse')+'" stroke="'+sk('cuisse')+'" stroke-width="1.8"/>';
 // legs
 s+='<path d="M52,200 L50,268 L63,270 L67,202 Z" fill="'+f('jambe')+'" stroke="'+sk('jambe')+'" stroke-width="1.8"/>';
 s+='<path d="M98,200 L100,268 L87,270 L83,202 Z" fill="'+f('jambe')+'" stroke="'+sk('jambe')+'" stroke-width="1.8"/>';
 // feet
 s+='<path d="M50,272 L48,288 L68,288 L64,272 Z" fill="'+f('pied')+'" stroke="'+sk('pied')+'" stroke-width="1.6"/>';
 s+='<path d="M100,272 L102,288 L82,288 L86,272 Z" fill="'+f('pied')+'" stroke="'+sk('pied')+'" stroke-width="1.6"/>';
 // ping markers on highlighted zones
 var pins={tete:[75,26],tronc:[75,88],epaule:[100,60],bras:[49,90],avant_bras:[35,136],main:[33,167],cuisse:[63,160],jambe:[58,234],pied:[58,280]};
 for(var k in pins){if(on(k)){var p=pins[k];s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="#e2952b" stroke="#fff" stroke-width="1.5"/>';}}
 return s+'</svg>';
}

/* region extraction for PM from sieges */
function pmRegions(sieges){
 var t=(sieges||'').toLowerCase(),R={};function a(k){R[k]=1;}
 if(/t[eê]te|cou\b|nuque|face|cervic|scalp|cuir chevelu/.test(t))a('tete');
 if(/paroi|tronc|thorax|abdom|dos|lombaire|fesse|para[-\s]?vert|rachis/.test(t))a('tronc');
 if(/[eé]paule|axill|scapul|deltoïd|deltoid/.test(t))a('epaule');
 if(/\bbras\b|brachial|biceps|triceps/.test(t))a('bras');
 if(/avant[-\s]?bras|coude|cubital/.test(t))a('avant_bras');
 if(/main|poignet|doigt|paume|phalang|carp/.test(t))a('main');
 if(/cuisse|f[eé]mor|inguin|racine.*membre|hanche|adducteur|quadriceps/.test(t))a('cuisse');
 if(/jambe|genou|mollet|poplit|creux poplit|tibial|p[eé]ronier|gastrocn/.test(t))a('jambe');
 if(/pied|cheville|plantaire|plante|orteil|tarse|m[eé]tatars/.test(t))a('pied');
 if(Object.keys(R).length===0)a('tronc');
 return R;
}

var tests=[
 {nom:'Lipome intramusculaire (cuisse)',plan:['plan_intramusculaire'],sieges:'cuisse, bras, épaule ; membres'},
 {nom:'Fibromatose desmoïde (paroi)',plan:['plan_profond'],sieges:'paroi abdominale, racine des membres, épaule'},
 {nom:'Schwannome (nerf, avant-bras)',plan:['plan_peri_nerveux'],sieges:'trajet nerveux, avant-bras, creux poplité'},
 {nom:'Kyste sébacé (dermique)',plan:['plan_dermique','plan_sous_cutane'],sieges:'cuir chevelu, dos, face'},
 {nom:'Tumeur glomique (doigt)',plan:['plan_sous_cutane'],sieges:'doigt, main, lit unguéal'},
 {nom:'Sarcome synovial (genou)',plan:['plan_juxta_articulaire','plan_profond'],sieges:'genou, cheville, pied ; juxta-articulaire'}
];
var html='';
tests.forEach(function(e){
 html+='<div class="card"><h3>'+e.nom+'</h3><div class="schemas">'+
   '<div class="sch">'+bodyMap(pmRegions(e.sieges))+'<div class="schcap">Sièges préférentiels</div></div>'+
   '<div class="sch">'+stMap(e.plan)+'<div class="schcap">Plan</div></div>'+
 '</div></div>';
});
document.getElementById('app').innerHTML='<div class="row">'+html+'</div>';
</script>
