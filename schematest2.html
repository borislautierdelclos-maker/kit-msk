<!doctype html><meta charset="utf-8"><style>
body{background:#EEF1F4;font-family:system-ui;margin:0;padding:18px}.row{display:flex;gap:22px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #CDD5DD;border-radius:12px;padding:14px;text-align:center}.card svg{width:230px;height:auto}
.dark{background:#0E141A}.dark .card{background:#161E26;border-color:#2A3743}.dark h4{color:#93A2B1}h4{margin:0 0 8px;font-size:12px;color:#5A6876}button{margin:0 0 14px}
</style>
<button onclick="document.body.classList.toggle('dark')">toggle dark</button><div id="app" class="row"></div>
<script>
function stMap(plan){
 function on(k){var a=k.replace('plan_',''),pp=(plan||[]);return pp.indexOf(k)>=0||pp.indexOf(a)>=0;}
 var HL='#1a9d90';var SKIN='#e3b98f',SKINk='#c48a5e',FAT='#f3e3a3',FATk='#dcc877',FASC='#aeb9bb',
     MUS='#c07065',MUSk='#9c574c',SEP='#d98f84',BONE='#efe7d4',BONEk='#cfc3a1',MED='#f8f3e6',
     ART='#c0504d',VEN='#5b7fa6',NRV='#e0b84a',txt='#5A6876';
 var cx=70,cy=82;
 var s='<svg viewBox="0 0 214 168" font-family="Atkinson Hyperlegible, system-ui">';
 // concentric layers
 s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="64" ry="60" fill="'+SKIN+'" stroke="'+(on('plan_dermique')?HL:SKINk)+'" stroke-width="'+(on('plan_dermique')?3.4:1.4)+'"/>';
 s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="57" ry="53" fill="'+FAT+'" stroke="'+(on('plan_sous_cutane')?HL:FATk)+'" stroke-width="'+(on('plan_sous_cutane')?3.4:1)+'"/>';
 s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="47" ry="43" fill="none" stroke="'+FASC+'" stroke-width="2"/>';
 var mh=(on('plan_intramusculaire')||on('plan_profond'));
 s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="45" ry="41" fill="'+MUS+'" stroke="'+(mh?HL:MUSk)+'" stroke-width="'+(mh?3.4:1)+'"/>';
 // septa
 s+='<path d="M'+cx+','+(cy-40)+' Q'+(cx+5)+','+cy+' '+cx+','+(cy+42)+'" fill="none" stroke="'+SEP+'" stroke-width="1.3" opacity=".75"/>';
 s+='<path d="M'+(cx-40)+','+(cy+16)+' Q'+(cx-6)+','+(cy+4)+' '+(cx+2)+','+(cy+30)+'" fill="none" stroke="'+SEP+'" stroke-width="1.1" opacity=".6"/>';
 // bone eccentric
 var bx=cx+6,by=cy+15,jh=on('plan_juxta_articulaire');
 s+='<circle cx="'+bx+'" cy="'+by+'" r="17" fill="'+BONE+'" stroke="'+(jh?HL:BONEk)+'" stroke-width="'+(jh?3.4:2.4)+'"/>';
 s+='<circle cx="'+bx+'" cy="'+by+'" r="10" fill="'+MED+'" stroke="'+BONEk+'" stroke-width="1"/>';
 // NV bundle
 var nh=on('plan_peri_nerveux'),nx=cx-30,ny=cy+24;
 if(nh)s+='<circle cx="'+nx+'" cy="'+ny+'" r="11.5" fill="none" stroke="'+HL+'" stroke-width="2.6" stroke-dasharray="3 2"/>';
 s+='<circle cx="'+(nx-3.5)+'" cy="'+ny+'" r="3.6" fill="'+ART+'"/><circle cx="'+(nx+3.5)+'" cy="'+(ny-2)+'" r="4" fill="'+VEN+'"/><circle cx="'+(nx+2)+'" cy="'+(ny+5)+'" r="2.7" fill="'+NRV+'"/>';
 // LEGEND right
 var rows=[['Peau',SKIN,'plan_dermique'],['Graisse SC',FAT,'plan_sous_cutane'],['Fascia',FASC,''],['Muscle',MUS,'plan_intramusculaire'],['Os',BONE,'plan_juxta_articulaire'],['Paquet VN',NRV,'plan_peri_nerveux']];
 var lx=146, y0=24, dy=23;
 rows.forEach(function(r,i){var yy=y0+i*dy; var act=r[2]&&on(r[2]);
   s+='<circle cx="'+lx+'" cy="'+(yy-3)+'" r="6" fill="'+r[1]+'" stroke="'+(act?HL:'#c9d0d2')+'" stroke-width="'+(act?2.4:1)+'"/>';
   s+='<text x="'+(lx+12)+'" y="'+yy+'" font-size="11" font-weight="'+(act?700:400)+'" fill="'+(act?HL:txt)+'">'+r[0]+'</text>';
 });
 return s+'</svg>';
}
var tests=[["Intramusculaire",['plan_intramusculaire']],["Sous-cutané",['plan_sous_cutane']],["Dermique",['plan_dermique']],["Péri-nerveux",['plan_peri_nerveux']],["Juxta-articulaire",['plan_juxta_articulaire']],["(aucun)",[]]];
document.getElementById("app").innerHTML=tests.map(function(t){return '<div class="card"><h4>'+t[0]+'</h4>'+stMap(t[1])+'</div>';}).join("");
</script>
