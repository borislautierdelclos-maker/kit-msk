<!doctype html><meta charset="utf-8"><style>
body{background:#EEF1F4;font-family:system-ui;margin:0;padding:18px}
.row{display:flex;gap:22px;flex-wrap:wrap}.card{background:#fff;border:1px solid #CDD5DD;border-radius:12px;padding:14px;text-align:center}
.card svg{width:165px;height:auto}.dark{background:#0E141A}.dark .card{background:#161E26;border-color:#2A3743}.dark h4{color:#93A2B1}
h4{margin:0 0 8px;font-size:12px;color:#5A6876}button{margin:0 0 14px;padding:6px 12px}
</style>
<button onclick="document.body.classList.toggle('dark')">toggle dark</button>
<div id="app" class="row"></div>
<script>
var BONE="#eef2f2",STK="#9aa7a9",HL="#1a9d90",HLS="#0b6a60";
function _capR(hl,x1,y1,x2,y2,w1,w2){w2=w2||w1*0.8;var f=hl?HL:BONE,st=hl?HLS:STK,sw=hl?2:1.35;
 var ang=Math.atan2(y2-y1,x2-x1),nx=Math.cos(ang+Math.PI/2),ny=Math.sin(ang+Math.PI/2);
 return '<path d="M'+(x1+nx*w1).toFixed(1)+' '+(y1+ny*w1).toFixed(1)+' L'+(x2+nx*w2).toFixed(1)+' '+(y2+ny*w2).toFixed(1)+
  ' Q'+(x2+Math.cos(ang)*w2*1.35).toFixed(1)+' '+(y2+Math.sin(ang)*w2*1.35).toFixed(1)+' '+(x2-nx*w2).toFixed(1)+' '+(y2-ny*w2).toFixed(1)+
  ' L'+(x1-nx*w1).toFixed(1)+' '+(y1-ny*w1).toFixed(1)+
  ' Q'+(x1-Math.cos(ang)*w1*1.35).toFixed(1)+' '+(y1-Math.sin(ang)*w1*1.35).toFixed(1)+' '+(x1+nx*w1).toFixed(1)+' '+(y1+ny*w1).toFixed(1)+' Z" fill="'+f+'" stroke="'+st+'" stroke-width="'+sw+'"/>';
}
function _knob(hl,x,y,r){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(hl?HL:BONE)+'" stroke="'+(hl?HLS:STK)+'" stroke-width="'+(hl?1.9:1.3)+'"/>';}
function _hand(hl,cx,topY,dir){var f=hl?HL:BONE,st=hl?HLS:STK,w=hl?1.6:1.1;var s='<g>';
 s+='<path d="M'+(cx-4.5)+' '+topY+' Q'+cx+' '+(topY-2)+' '+(cx+4.5)+' '+topY+' L'+(cx+4)+' '+(topY+6)+' Q'+cx+' '+(topY+8)+' '+(cx-4)+' '+(topY+6)+' Z" fill="'+f+'" stroke="'+st+'" stroke-width="'+w+'"/>';
 var spread=[-3.2,-1.1,1.1,3.2];
 spread.forEach(function(off,i){var mid=i==1||i==2;var bx=cx+off; var fx=cx+off*1.15;
   var mcY=topY+6-7*(mid?1.1:1), p1=mcY+ (topY<200?0:0); // downward fingers
   var dY=topY+6; var m1=dY+ (6.5*(mid?1.1:0.95)); var ph1=m1+4.5; var ph2=ph1+3.4;
   s+='<line x1="'+bx+'" y1="'+dY+'" x2="'+fx+'" y2="'+m1+'" stroke="'+st+'" stroke-width="'+(w+0.4)+'" stroke-linecap="round"/>';
   s+='<line x1="'+fx+'" y1="'+m1+'" x2="'+fx+'" y2="'+ph1+'" stroke="'+st+'" stroke-width="'+(w+0.1)+'" stroke-linecap="round"/>';
   s+='<line x1="'+fx+'" y1="'+ph1+'" x2="'+fx+'" y2="'+ph2+'" stroke="'+st+'" stroke-width="'+w+'" stroke-linecap="round"/>';
 });
 s+='<line x1="'+(cx-dir*3.5)+'" y1="'+(topY+5)+'" x2="'+(cx-dir*8.5)+'" y2="'+(topY+9)+'" stroke="'+st+'" stroke-width="'+(w+0.4)+'" stroke-linecap="round"/>';
 return s+'</g>';
}
function _foot(hl,x,y,dir){var f=hl?HL:BONE,st=hl?HLS:STK,w=hl?1.6:1.1;var s='<g>';
 // tarsus (heel+midfoot) compact block
 s+='<path d="M'+(x-dir*3)+' '+y+' Q'+(x-dir*4.5)+' '+(y+5)+' '+(x)+' '+(y+6.5)+' L'+(x+dir*4)+' '+(y+6.5)+' Q'+(x+dir*5)+' '+(y+2)+' '+(x+dir*2)+' '+y+' Z" fill="'+f+'" stroke="'+st+'" stroke-width="'+w+'"/>';
 // 5 short metatarsals forward (dir) + toe tips
 for(var i=0;i<5;i++){var a=x+dir*3, ay=y+3+i*0.8, ex=x+dir*(8.5+i*0.3), ey=y+6.5+i*1.0;
   s+='<line x1="'+a+'" y1="'+ay+'" x2="'+ex+'" y2="'+ey+'" stroke="'+st+'" stroke-width="'+(w+0.2)+'" stroke-linecap="round"/>';}
 return s+'</g>';
}
function skeleton(R){
 function on(){for(var i=0;i<arguments.length;i++)if(R[arguments[i]])return true;return false;}
 function fl(k){return on(k)?HL:BONE;} function st(k){return on(k)?HLS:STK;} function sw(k){return on(k)?2:1.3;}
 var s='<svg viewBox="0 0 150 372" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round">';
 // SKULL
 var ck=fl("crane"),cs=st("crane"),cw=sw("crane");
 s+='<path d="M75 7 C88 7 96 18 96 30 C96 38 92 44 88 47 C87 52 85 56 80 57 L70 57 C65 56 63 52 62 47 C58 44 54 38 54 30 C54 18 62 7 75 7 Z" fill="'+ck+'" stroke="'+cs+'" stroke-width="'+cw+'"/>';
 s+='<ellipse cx="68.5" cy="32" rx="3.2" ry="3.8" fill="#cdd7d7" opacity=".5"/><ellipse cx="81.5" cy="32" rx="3.2" ry="3.8" fill="#cdd7d7" opacity=".5"/><path d="M72 40 l3 4 l-3 1" fill="none" stroke="'+cs+'" stroke-width=".8" opacity=".5"/><path d="M68 50 Q75 46 82 50" fill="none" stroke="'+cs+'" stroke-width="1" opacity=".6"/>';
 // SPINE (S-curve) cervical->sacrum
 var rk=fl("rachis"),rs=st("rachis");
 var spine=[]; for(var n=0;n<22;n++){var ty=59+n*4.4; var cxv=75+Math.sin(n/21*Math.PI*1.1)* (n<7?-2: n<15?2.5:1.2)*0; // slight curve
   var curve = (n<6? (6-n)*0.5 : (n<14? -(n-6)*0.4 : (n-14)*0.6));
   spine.push([75+curve, ty, 4.2+n*0.28]); }
 spine.forEach(function(v,i){s+='<rect x="'+(v[0]-v[2]).toFixed(1)+'" y="'+v[1].toFixed(1)+'" width="'+(v[2]*2).toFixed(1)+'" height="'+(i<6?2.8:3.6).toFixed(1)+'" rx="1.8" fill="'+rk+'" stroke="'+rs+'" stroke-width="1.1"/>';});
 // STERNUM + RIBCAGE
 var cR=st("cotes"),crw=on("cotes")?2.6:1.7;
 s+='<rect x="72" y="92" width="6" height="30" rx="3" fill="'+fl("cotes")+'" stroke="'+cR+'" stroke-width="1.2"/>';
 var ribY=[92,101,110,119,128,136]; ribY.forEach(function(y,i){var reach=30-i*1.2, drop=12+i*2, sternY=y+6+i*3.2, sx=i<5?76:78;
   s+='<path d="M72 '+y+' C'+(75-reach)+' '+(y-3)+' '+(75-reach-3)+' '+(y+drop*0.7)+' '+(sx-4)+' '+sternY+'" fill="none" stroke="'+cR+'" stroke-width="'+crw+'"/>';
   s+='<path d="M78 '+y+' C'+(75+reach)+' '+(y-3)+' '+(75+reach+3)+' '+(y+drop*0.7)+' '+(sx)+' '+sternY+'" fill="none" stroke="'+cR+'" stroke-width="'+crw+'"/>';});
 // CLAVICLES + shoulders
 var gs=st("ceinture"),gw=sw("ceinture");
 s+='<path d="M74 71 Q60 66 47 73" fill="none" stroke="'+gs+'" stroke-width="'+(on("ceinture")?3:2)+'"/><path d="M76 71 Q90 66 103 73" fill="none" stroke="'+gs+'" stroke-width="'+(on("ceinture")?3:2)+'"/>';
 s+=_knob(on("ceinture"),45,75,5.5)+_knob(on("ceinture"),105,75,5.5);
 // ARMS: humerus, elbow, forearm(2 bones)
 s+=_capR(on("humerus"),45,80,40,137,5,4)+_capR(on("humerus"),105,80,110,137,5,4);
 s+=_knob(false,40,139,3.4)+_knob(false,110,139,3.4);
 s+=_capR(on("avant_bras"),40,142,37,196,3.8,3)+_capR(on("avant_bras"),44,142,42,196,2.8,2.4);
 s+=_capR(on("avant_bras"),110,142,113,196,3.8,3)+_capR(on("avant_bras"),106,142,108,196,2.8,2.4);
 // HANDS
 s+=_hand(on("mains"),38,199,-1)+_hand(on("mains"),112,199,1);
 // PELVIS
 var bk=fl("bassin"),bs=st("bassin"),bw=sw("bassin");
 s+='<path d="M61 160 C50 162 47 180 56 189 C63 194 71 191 73 183 L73 168 C71 162 67 159 61 160 Z" fill="'+bk+'" stroke="'+bs+'" stroke-width="'+bw+'"/>';
 s+='<path d="M89 160 C100 162 103 180 94 189 C87 194 79 191 77 183 L77 168 C79 162 83 159 89 160 Z" fill="'+bk+'" stroke="'+bs+'" stroke-width="'+bw+'"/>';
 s+='<path d="M73 167 L77 167 L75.5 188 L74.5 188 Z" fill="'+fl("sacrum")+'" stroke="'+st("sacrum")+'" stroke-width="1.1"/>';
 s+='<path d="M64 189 Q75 197 86 189" fill="none" stroke="'+bs+'" stroke-width="'+bw+'"/>';
 s+=_knob(false,60,187,4.6)+_knob(false,90,187,4.6);
 // LEGS: femur, patella, tibia+fibula, ankle
 s+=_capR(on("femur"),60,190,58,258,5.8,4.8)+_capR(on("femur"),90,190,92,258,5.8,4.8);
 s+=_knob(on("genou"),58,261,5)+_knob(on("genou"),92,261,5);
 s+=_capR(on("tibia"),58,265,57,332,4.8,4)+_capR(on("tibia"),62,266,62,328,2.6,2.2);
 s+=_capR(on("tibia"),92,265,93,332,4.8,4)+_capR(on("tibia"),88,266,88,328,2.6,2.2);
 s+=_knob(false,57,334,3.3)+_knob(false,93,334,3.3);
 // FEET
 s+=_foot(on("pieds"),57,336,-1)+_foot(on("pieds"),93,336,1);
 // PING overlay
 var CEN={crane:[[75,32]],rachis:[[75,110]],cotes:[[58,106],[92,106]],ceinture:[[45,75],[105,75]],humerus:[[42,108],[108,108]],avant_bras:[[39,169],[111,169]],mains:[[32,205],[118,205]],bassin:[[60,176],[90,176]],sacrum:[[75,178]],femur:[[59,224],[91,224]],genou:[[58,261],[92,261]],tibia:[[58,298],[92,298]],pieds:[[49,344],[101,344]]};
 var PG="";for(var k in CEN){if(R[k]){CEN[k].forEach(function(p){PG+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8.5" fill="#fff" opacity=".9"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="5.6" fill="#E8641E" stroke="#fff" stroke-width="1.6"/>';});}}
 return s+PG+'</svg>';
}
var tests=[["Tout",{}],["Mains",{mains:1}],["Genou",{genou:1,femur:1,tibia:1}],["Rachis+bassin",{rachis:1,bassin:1,sacrum:1}],["Épaule+côtes",{ceinture:1,cotes:1,humerus:1}],["Crâne+pieds",{crane:1,pieds:1}]];
document.getElementById("app").innerHTML=tests.map(function(t){return '<div class="card"><h4>'+t[0]+'</h4>'+skeleton(t[1])+'</div>';}).join("");
</script>
