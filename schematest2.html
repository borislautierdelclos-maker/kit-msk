<!doctype html><meta charset="utf-8"><style>
body{background:#EEF1F4;font-family:system-ui;margin:0;padding:18px}.row{display:flex;gap:22px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #CDD5DD;border-radius:12px;padding:14px;text-align:center}.card svg{width:150px;height:auto}
.dark{background:#0E141A}.dark .card{background:#161E26;border-color:#2A3743}.dark h4{color:#93A2B1}h4{margin:0 0 8px;font-size:12px;color:#5A6876}button{margin:0 0 14px}
</style>
<button onclick="document.body.classList.toggle('dark')">toggle dark</button><div id="app" class="row"></div>
<script>
function bodyMap(R){
 var SIL="#e7ecee",ST="#b9c5c8",H="#1a9d90",HS="#0b6a60";
 function on(k){return !!R[k];} function f(k){return on(k)?H:SIL;} function s2(k){return on(k)?HS:ST;} function w(k){return on(k)?2:1.3;}
 var s='<svg viewBox="0 0 150 334" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round">';
 // HEAD + NECK
 s+='<circle cx="75" cy="26" r="16" fill="'+f("tete")+'" stroke="'+s2("tete")+'" stroke-width="'+w("tete")+'"/>';
 s+='<path d="M68 40 L68 50 Q75 54 82 50 L82 40" fill="'+f("tete")+'" stroke="'+s2("tete")+'" stroke-width="'+w("tete")+'"/>';
 // TORSO (trunk): shoulders -> waist -> hips, smooth
 s+='<path d="M52 56 Q75 50 98 56 C104 58 106 66 103 78 L99 108 Q96 124 92 132 L58 132 Q54 124 51 108 L47 78 C44 66 46 58 52 56 Z" fill="'+f("tronc")+'" stroke="'+s2("tronc")+'" stroke-width="'+w("tronc")+'"/>';
 // SHOULDERS (deltoid caps)
 s+='<path d="M52 56 Q40 58 38 72 Q46 66 54 66 Z" fill="'+f("epaule")+'" stroke="'+s2("epaule")+'" stroke-width="'+w("epaule")+'"/>';
 s+='<path d="M98 56 Q110 58 112 72 Q104 66 96 66 Z" fill="'+f("epaule")+'" stroke="'+s2("epaule")+'" stroke-width="'+w("epaule")+'"/>';
 // UPPER ARMS
 s+='<path d="M40 70 Q35 72 34 84 L39 116 Q44 118 48 115 L50 80 Q50 70 44 68 Z" fill="'+f("bras")+'" stroke="'+s2("bras")+'" stroke-width="'+w("bras")+'"/>';
 s+='<path d="M110 70 Q115 72 116 84 L111 116 Q106 118 102 115 L100 80 Q100 70 106 68 Z" fill="'+f("bras")+'" stroke="'+s2("bras")+'" stroke-width="'+w("bras")+'"/>';
 // FOREARMS
 s+='<path d="M39 118 L36 158 Q40 162 45 159 L48 118 Q44 120 39 118 Z" fill="'+f("avant_bras")+'" stroke="'+s2("avant_bras")+'" stroke-width="'+w("avant_bras")+'"/>';
 s+='<path d="M111 118 L114 158 Q110 162 105 159 L102 118 Q106 120 111 118 Z" fill="'+f("avant_bras")+'" stroke="'+s2("avant_bras")+'" stroke-width="'+w("avant_bras")+'"/>';
 // HANDS
 s+='<ellipse cx="40" cy="169" rx="6.5" ry="9" fill="'+f("main")+'" stroke="'+s2("main")+'" stroke-width="'+w("main")+'"/>';
 s+='<ellipse cx="110" cy="169" rx="6.5" ry="9" fill="'+f("main")+'" stroke="'+s2("main")+'" stroke-width="'+w("main")+'"/>';
 // THIGHS
 s+='<path d="M58 134 Q56 150 55 172 L58 214 Q64 218 70 214 L73 170 Q74 150 73 136 Z" fill="'+f("cuisse")+'" stroke="'+s2("cuisse")+'" stroke-width="'+w("cuisse")+'"/>';
 s+='<path d="M92 134 Q94 150 95 172 L92 214 Q86 218 80 214 L77 170 Q76 150 77 136 Z" fill="'+f("cuisse")+'" stroke="'+s2("cuisse")+'" stroke-width="'+w("cuisse")+'"/>';
 // LEGS
 s+='<path d="M58 218 L56 280 Q62 284 68 281 L69 218 Q64 221 58 218 Z" fill="'+f("jambe")+'" stroke="'+s2("jambe")+'" stroke-width="'+w("jambe")+'"/>';
 s+='<path d="M92 218 L94 280 Q88 284 82 281 L81 218 Q86 221 92 218 Z" fill="'+f("jambe")+'" stroke="'+s2("jambe")+'" stroke-width="'+w("jambe")+'"/>';
 // FEET
 s+='<path d="M58 282 L56 298 Q66 302 72 298 L70 283 Q64 286 58 282 Z" fill="'+f("pied")+'" stroke="'+s2("pied")+'" stroke-width="'+w("pied")+'"/>';
 s+='<path d="M92 282 L94 298 Q84 302 78 298 L80 283 Q86 286 92 282 Z" fill="'+f("pied")+'" stroke="'+s2("pied")+'" stroke-width="'+w("pied")+'"/>';
 // PINGS
 var pins={tete:[75,26],tronc:[75,94],epaule:[42,66],bras:[41,92],avant_bras:[41,140],main:[40,169],cuisse:[64,175],jambe:[62,250],pied:[64,292]};
 var P="";for(var k in pins){if(on(k)){var a=pins[k],b=[150-a[0],a[1]];[a,b].forEach(function(p){if(k=='tete'||k=='tronc'){if(p!==a)return;}P+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8.5" fill="#fff" opacity=".9"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="5.6" fill="#E8641E" stroke="#fff" stroke-width="1.6"/>';});}}
 return s+P+'</svg>';
}
var tests=[["Tout",{}],["Cuisse+épaule",{cuisse:1,epaule:1}],["Main",{main:1}],["Tronc(paroi)",{tronc:1}],["Jambe",{jambe:1}],["Tête+pied",{tete:1,pied:1}]];
document.getElementById("app").innerHTML=tests.map(function(t){return '<div class="card"><h4>'+t[0]+'</h4>'+bodyMap(t[1])+'</div>';}).join("");
</script>
