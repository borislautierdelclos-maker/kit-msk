<!doctype html><meta charset="utf-8"><style>
body{background:#EEF1F4;font-family:system-ui;margin:0;padding:18px}
.row{display:flex;gap:22px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #CDD5DD;border-radius:12px;padding:14px;text-align:center}
.card svg{width:150px;height:auto}
.dark .card{background:#161E26;border-color:#2A3743}
h4{margin:0 0 8px;font-size:12px;color:#5A6876}
button{margin:0 0 14px;padding:6px 12px}
</style>
<button onclick="document.body.classList.toggle('dark')">toggle dark</button>
<div id="app" class="row"></div>
<script>
function _cap2(x1,y1,x2,y2,hl,w){ // tapered long-bone segment with rounded ends
  var BONE="#eef2f2",STK="#9fabad",HL="#1a9d90";
  var f=hl?HL:BONE,st=hl?"#0b6a60":STK,sw=hl?2.1:1.4;
  var ang=Math.atan2(y2-y1,x2-x1),len=Math.hypot(x2-x1,y2-y1);
  var w1=w,w2=w*0.82;
  // build a capsule path
  var nx=Math.cos(ang+Math.PI/2),ny=Math.sin(ang+Math.PI/2);
  var p1=[x1+nx*w1,y1+ny*w1],p2=[x2+nx*w2,y2+ny*w2],p3=[x2-nx*w2,y2-ny*w2],p4=[x1-nx*w1,y1-ny*w1];
  var s='<path d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L'+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+
        ' Q'+(x2+Math.cos(ang)*w2*1.1).toFixed(1)+' '+(y2+Math.sin(ang)*w2*1.1).toFixed(1)+' '+p3[0].toFixed(1)+' '+p3[1].toFixed(1)+
        ' L'+p4[0].toFixed(1)+' '+p4[1].toFixed(1)+
        ' Q'+(x1-Math.cos(ang)*w1*1.1).toFixed(1)+' '+(y1-Math.sin(ang)*w1*1.1).toFixed(1)+' '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' Z" fill="'+f+'" stroke="'+st+'" stroke-width="'+sw+'"/>';
  return s;
}
function skeleton(R){
 var BONE="#eef2f2",STK="#9fabad",HL="#1a9d90";
 function on(){for(var i=0;i<arguments.length;i++)if(R[arguments[i]])return true;return false;}
 function fl(k){return on(k)?HL:BONE;} function st(k){return on(k)?"#0b6a60":STK;} function sw(k){return on(k)?2.1:1.3;}
 var s='<svg viewBox="0 0 150 362" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round">';
 // SKULL + mandible
 var ck=fl("crane"),cs=st("crane"),cw=sw("crane");
 s+='<path d="M75 7 C87 7 95 17 95 29 C95 37 91 43 87 46 C86 51 84 54 80 55 L70 55 C66 54 64 51 63 46 C59 43 55 37 55 29 C55 17 63 7 75 7 Z" fill="'+ck+'" stroke="'+cs+'" stroke-width="'+cw+'"/>';
 s+='<ellipse cx="69" cy="31" rx="3.1" ry="3.6" fill="#cfd8d8" opacity=".55"/><ellipse cx="81" cy="31" rx="3.1" ry="3.6" fill="#cfd8d8" opacity=".55"/>';
 s+='<path d="M67 48 Q75 44 83 48" fill="none" stroke="'+cs+'" stroke-width="1" opacity=".7"/>';
 // CERVICAL (thin stack)
 var rk=fl("rachis"),rs=st("rachis"),rw=sw("rachis");
 for(var y=58;y<76;y+=5){s+='<rect x="71" y="'+y+'" width="8" height="4" rx="2" fill="'+rk+'" stroke="'+rs+'" stroke-width="1.1"/>';}
 // THORACIC spine + sternum + ribcage
 var cR=st("cotes"),crw=on("cotes")?2.8:1.8, cf=on("cotes")?"#1a9d90":"none";
 // vertebral bodies thoracic/lumbar (curve)
 var spY=[78,88,98,108,118,128,138,148];
 spY.forEach(function(y,i){var w=9+i*0.5;s+='<rect x="'+(75-w/2).toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="7" rx="2.4" fill="'+rk+'" stroke="'+rs+'" stroke-width="1.3"/>';});
 // sternum
 s+='<rect x="72" y="84" width="6" height="26" rx="3" fill="'+fl("cotes")+'" stroke="'+cR+'" stroke-width="1.2" opacity="'+(on("cotes")?1:.9)+'"/>';
 // ribs (6 pairs, curved from spine to sternum)
 var ribY=[86,95,104,113,122,130];
 ribY.forEach(function(y,i){var drop=10+i*2.2, reach=28-i*1.0;
   s+='<path d="M72 '+y+' C'+(75-reach)+' '+(y-2)+' '+(75-reach-4)+' '+(y+drop*0.6)+' '+(75-reach*0.5)+' '+(y+drop)+'" fill="none" stroke="'+cR+'" stroke-width="'+crw+'"/>';
   s+='<path d="M78 '+y+' C'+(75+reach)+' '+(y-2)+' '+(75+reach+4)+' '+(y+drop*0.6)+' '+(75+reach*0.5)+' '+(y+drop)+'" fill="none" stroke="'+cR+'" stroke-width="'+crw+'"/>';});
 // CLAVICLES + shoulders
 var gk=fl("ceinture"),gs=st("ceinture"),gw=sw("ceinture");
 s+='<path d="M74 70 Q60 66 48 72" fill="none" stroke="'+gs+'" stroke-width="'+(on("ceinture")?3:2)+'"/><path d="M76 70 Q90 66 102 72" fill="none" stroke="'+gs+'" stroke-width="'+(on("ceinture")?3:2)+'"/>';
 s+='<circle cx="46" cy="74" r="5.5" fill="'+gk+'" stroke="'+gs+'" stroke-width="'+gw+'"/><circle cx="104" cy="74" r="5.5" fill="'+gk+'" stroke="'+gs+'" stroke-width="'+gw+'"/>';
 // HUMERUS
 s+=_capR("humerus",on,46,80,41,132,5.5)+_capR("humerus",on,104,80,109,132,5.5);
 // elbow
 s+='<circle cx="41" cy="134" r="3.6" fill="#eef2f2" stroke="#9fabad" stroke-width="1.3"/><circle cx="109" cy="134" r="3.6" fill="#eef2f2" stroke="#9fabad" stroke-width="1.3"/>';
 // FOREARM (radius+ulna)
 s+=_capR("avant_bras",on,40,137,37,186,4.2)+_capR("avant_bras",on,45,137,43,186,3.2)
   +_capR("avant_bras",on,110,137,113,186,4.2)+_capR("avant_bras",on,105,137,107,186,3.2);
 // HANDS: carpus + metacarpals + phalanges (simplified)
 ["mains"].forEach(function(){});
 s+=_hand(on,40,190,-1,fl,st,sw)+_hand(on,110,190,1,fl,st,sw);
 // PELVIS: iliac wings + sacrum + pubis
 var bk=fl("bassin"),bs=st("bassin"),bw=sw("bassin");
 s+='<path d="M60 158 C50 160 48 176 56 184 C62 189 70 187 72 180 L72 166 C70 160 66 157 60 158 Z" fill="'+bk+'" stroke="'+bs+'" stroke-width="'+bw+'"/>';
 s+='<path d="M90 158 C100 160 102 176 94 184 C88 189 80 187 78 180 L78 166 C80 160 84 157 90 158 Z" fill="'+bk+'" stroke="'+bs+'" stroke-width="'+bw+'"/>';
 var sk2=fl("sacrum");s+='<path d="M72 165 L78 165 L76 184 L74 184 Z" fill="'+sk2+'" stroke="'+st("sacrum")+'" stroke-width="1.2"/>';
 s+='<path d="M66 185 Q75 192 84 185" fill="none" stroke="'+bs+'" stroke-width="'+bw+'"/>'; // pubis
 // hip joints
 s+='<circle cx="60" cy="183" r="4.6" fill="#eef2f2" stroke="#9fabad" stroke-width="1.5"/><circle cx="90" cy="183" r="4.6" fill="#eef2f2" stroke="#9fabad" stroke-width="1.5"/>';
 // FEMUR
 s+=_capR("femur",on,60,186,58,250,6)+_capR("femur",on,90,186,92,250,6);
 // KNEE (patella)
 var kk=fl("genou"),ks=st("genou");
 s+='<circle cx="58" cy="253" r="5" fill="'+kk+'" stroke="'+ks+'" stroke-width="'+sw("genou")+'"/><circle cx="92" cy="253" r="5" fill="'+kk+'" stroke="'+ks+'" stroke-width="'+sw("genou")+'"/>';
 // TIBIA + fibula
 s+=_capR("tibia",on,58,257,57,322,5)+_capR("tibia",on,62,258,62,318,2.8)
   +_capR("tibia",on,92,257,93,322,5)+_capR("tibia",on,88,258,88,318,2.8);
 // ankle
 s+='<circle cx="57" cy="324" r="3.4" fill="#eef2f2" stroke="#9fabad" stroke-width="1.3"/><circle cx="93" cy="324" r="3.4" fill="#eef2f2" stroke="#9fabad" stroke-width="1.3"/>';
 // FEET
 s+=_foot(on,57,327,fl,st,sw)+_foot(on,93,327,fl,st,sw);
 // PING overlay
 var CEN={crane:[[75,30]],rachis:[[75,110]],cotes:[[58,100],[92,100]],ceinture:[[46,74],[104,74]],humerus:[[43,106],[107,106]],avant_bras:[[40,162],[110,162]],mains:[[33,205],[117,205]],bassin:[[60,172],[90,172]],sacrum:[[76,175]],femur:[[59,218],[91,218]],genou:[[58,253],[92,253]],tibia:[[58,290],[92,290]],pieds:[[52,335],[98,335]]};
 var PG="";for(var k in CEN){if(R[k]){CEN[k].forEach(function(p){PG+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8.5" fill="#fff" opacity=".9"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="5.6" fill="#E8641E" stroke="#fff" stroke-width="1.6"/>';});}}
 s+=PG;
 return s+'</svg>';
}
function _capR(key,on,x1,y1,x2,y2,w){var BONE="#eef2f2",STK="#9fabad",HL="#1a9d90";var hl=on(key);var f=hl?HL:BONE,st=hl?"#0b6a60":STK,sw=hl?2:1.4;
 var ang=Math.atan2(y2-y1,x2-x1),nx=Math.cos(ang+Math.PI/2),ny=Math.sin(ang+Math.PI/2);var w2=w*0.8;
 return '<path d="M'+(x1+nx*w)+' '+(y1+ny*w)+' L'+(x2+nx*w2)+' '+(y2+ny*w2)+' Q'+(x2+Math.cos(ang)*w2*1.3)+' '+(y2+Math.sin(ang)*w2*1.3)+' '+(x2-nx*w2)+' '+(y2-ny*w2)+' L'+(x1-nx*w)+' '+(y1-ny*w)+' Q'+(x1-Math.cos(ang)*w*1.3)+' '+(y1-Math.sin(ang)*w*1.3)+' '+(x1+nx*w)+' '+(y1+ny*w)+' Z" fill="'+f+'" stroke="'+st+'" stroke-width="'+sw+'"/>';
}
function _hand(on,cx,topY,dir,fl,st,sw){var hl=on("mains");var f=hl?"#1a9d90":"#eef2f2",stk=hl?"#0b6a60":"#9fabad",w=hl?1.8:1.2;
 var s='<g>';
 // carpus block
 s+='<rect x="'+(cx-5)+'" y="'+(topY+14)+'" width="10" height="7" rx="3" fill="'+f+'" stroke="'+stk+'" stroke-width="'+w+'"/>';
 // 4 metacarpals + phalanges fanning
 for(var i=0;i<4;i++){var mx=cx-6+i*4; var my=topY+14; var ty=topY-2-i*0.5;
   s+='<line x1="'+mx+'" y1="'+my+'" x2="'+(mx-1+dir*1)+'" y2="'+(my-10)+'" stroke="'+stk+'" stroke-width="'+(w+0.4)+'"/>';
   s+='<line x1="'+(mx-1+dir*1)+'" y1="'+(my-10)+'" x2="'+(mx-2+dir*2)+'" y2="'+(my-18)+'" stroke="'+stk+'" stroke-width="'+w+'"/>';
 }
 // thumb
 s+='<line x1="'+(cx+dir*5)+'" y1="'+(topY+18)+'" x2="'+(cx+dir*11)+'" y2="'+(topY+12)+'" stroke="'+stk+'" stroke-width="'+(w+0.4)+'"/>';
 return s+'</g>';
}
function _foot(on,x,y,fl,st,sw){var hl=on("pieds");var f=hl?"#1a9d90":"#eef2f2",stk=hl?"#0b6a60":"#9fabad",w=hl?1.8:1.2;
 var dir=x<75?-1:1;
 var s='<g>';
 s+='<path d="M'+x+' '+y+' q'+(dir*2)+' 7 '+(dir*2)+' 10" fill="none" stroke="'+stk+'" stroke-width="'+(w+0.6)+'"/>';
 // tarsus + metatarsals (toes forward = toward midline-ish/out)
 s+='<ellipse cx="'+(x+dir*3)+'" cy="'+(y+11)+'" rx="5" ry="3.5" fill="'+f+'" stroke="'+stk+'" stroke-width="'+w+'"/>';
 for(var i=0;i<4;i++){s+='<line x1="'+(x+dir*2+i*dir*2)+'" y1="'+(y+13)+'" x2="'+(x+dir*4+i*dir*2.5)+'" y2="'+(y+19)+'" stroke="'+stk+'" stroke-width="'+w+'"/>';}
 return s+'</g>';
}
var tests=[["Tout",{}],["Mains",{mains:1}],["Genou",{genou:1,femur:1,tibia:1}],["Rachis+bassin",{rachis:1,bassin:1,sacrum:1}],["Épaule+côtes",{ceinture:1,cotes:1,humerus:1}],["Crâne+pieds",{crane:1,pieds:1}]];
document.getElementById("app").innerHTML=tests.map(function(t){return '<div class="card"><h4>'+t[0]+'</h4>'+skeleton(t[1])+'</div>';}).join("");
</script>
